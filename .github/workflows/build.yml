name: 🔨 Build LG V60 Kernel + SuKiSu Ultra (Final Fix)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Branch kernel LineageOS'
        required: true
        default: 'lineage-23.2'
        type: choice
        options:
          - lineage-23.2
          - lineage-22.2
          - lineage-21
      sukisu_variant:
        description: 'Varian SuKiSu (susfs-main = lebih lengkap, main = dasar)'
        required: true
        default: 'susfs-main'
        type: choice
        options:
          - susfs-main
          - main

jobs:
  build:
    name: Build Kernel LG V60
    runs-on: ubuntu-22.04

    steps:
    - name: 📥 Checkout repo workflow
      uses: actions/checkout@v4

    - name: 🗑️ Bersihkan disk
      run: |
        echo "Ruang disk sebelum:"
        df -h /
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /usr/local/.ghcup \
          /usr/share/swift
        sudo apt-get clean
        echo "Ruang disk setelah:"
        df -h /

    - name: 📦 Install tools build
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          git bc bison flex libssl-dev libelf-dev \
          libncurses5-dev python3 python-is-python3 \
          zip unzip wget curl \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu \
          binutils-arm-linux-gnueabi

    - name: ⚙️ Install Clang 17
      run: |
        wget -q https://apt.llvm.org/llvm.sh -O llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 17
        for tool in clang clang++ ld.lld llvm-ar llvm-nm \
                    llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
          src="/usr/bin/${tool}-17"
          dst="/usr/local/bin/${tool}"
          [ -f "$src" ] && sudo ln -sf "$src" "$dst"
        done
        clang --version

    - name: 📥 Download kernel source
      run: |
        git clone --depth=1 \
          https://github.com/LineageOS/android_kernel_lge_sm8250 \
          -b ${{ github.event.inputs.kernel_branch }} \
          kernel
        head -5 kernel/Makefile

    - name: 🔍 Deteksi defconfig
      id: defconfig
      run: |
        if [ -f "kernel/arch/arm64/configs/vendor/timelm_defconfig" ]; then
          echo "defconfig=vendor/timelm_defconfig" >> $GITHUB_OUTPUT
        elif [ -f "kernel/arch/arm64/configs/timelm_defconfig" ]; then
          echo "defconfig=timelm_defconfig" >> $GITHUB_OUTPUT
        elif [ -f "kernel/arch/arm64/configs/vendor/kona-perf_defconfig" ]; then
          echo "defconfig=vendor/kona-perf_defconfig" >> $GITHUB_OUTPUT
        elif [ -f "kernel/arch/arm64/configs/kona-perf_defconfig" ]; then
          echo "defconfig=kona-perf_defconfig" >> $GITHUB_OUTPUT
        else
          echo "❌ Defconfig tidak ditemukan"
          exit 1
        fi

    - name: 💉 Inject SuKiSu Ultra
      run: |
        cd kernel
        curl -LSs \
          "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
          | bash -s ${{ github.event.inputs.sukisu_variant }}

    - name: 🔧 Terapkan manual hooks
      run: |
        python3 scripts/apply_hooks.py kernel

    # ============================================================
    # PERBAIKAN 1: Fix drivers/esoc/esoc.h (missing macro)
    # ============================================================
    - name: 🔧 Fix corrupted esoc.h
      run: |
        cd kernel
        ESOC_H="drivers/esoc/esoc.h"
        if [ -f "$ESOC_H" ]; then
          if grep -q '^[[:space:]]*do {' "$ESOC_H"; then
            sed -i '/^[[:space:]]*do {/i #define ESOC_DBG(fmt, ...) \\' "$ESOC_H"
            echo "✅ esoc.h diperbaiki"
          fi
        fi

    # ============================================================
    # PERBAIKAN 2: Fix fs/proc/cmdline.c (unused function)
    # ============================================================
    - name: 🔧 Fix unused function in fs/proc/cmdline.c
      run: |
        cd kernel
        CMDLINE_C="fs/proc/cmdline.c"
        if [ -f "$CMDLINE_C" ]; then
          # Tambahkan __maybe_unused ke fungsi yang tidak terpakai
          sed -i 's/static void proc_cmdline_set/static void __maybe_unused proc_cmdline_set/' "$CMDLINE_C"
          echo "✅ cmdline.c diperbaiki"
        fi

    # ============================================================
    # PERBAIKAN 3: (Opsional) Matikan Werror sementara jika masih ada error lain
    # ============================================================
    - name: 🔧 Disable -Werror globally (untuk mencegah kegagalan dari warning lain)
      run: |
        cd kernel
        # Hapus -Werror dari Makefile utama
        sed -i 's/-Werror /-Wno-error /g' Makefile
        # Juga hapus dari arch/arm64/Makefile jika ada
        sed -i 's/-Werror /-Wno-error /g' arch/arm64/Makefile 2>/dev/null || true
        echo "✅ -Werror dinonaktifkan"

    - name: 🏗️ Build kernel
      id: build
      continue-on-error: true
      run: |
        cd kernel
        export ARCH=arm64
        export SUBARCH=arm64
        export LLVM=1 LLVM_IAS=1

        make O=out \
          ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          ${{ steps.defconfig.outputs.defconfig }}

        ./scripts/config --file out/.config \
          --enable CONFIG_KSU --enable CONFIG_KSU_MANUAL_HOOK \
          --enable CONFIG_KALLSYMS --enable CONFIG_KALLSYMS_ALL \
          --enable CONFIG_KPM --disable CONFIG_KPROBES

        make O=out olddefconfig

        make -j$(nproc) O=out \
          ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          2>&1 | tee build.log

        if [ ! -f "out/arch/arm64/boot/Image" ] && [ ! -f "out/arch/arm64/boot/Image.gz" ]; then
          echo "Kernel image tidak ditemukan"
          exit 1
        fi

    - name: 📋 Upload build.log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: kernel/build.log
        retention-days: 7

    - name: 🔍 Tampilkan error jika gagal
      if: steps.build.outcome == 'failure'
      run: |
        echo "=== 100 baris terakhir build.log ==="
        tail -100 kernel/build.log
        echo ""
        echo "=== Baris yang mengandung 'error:' ==="
        grep -n "error:" kernel/build.log | head -30
        exit 1

    - name: 📦 Buat paket kernel (AnyKernel3)
      if: steps.build.outcome == 'success'
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
        cd AnyKernel3
        sed -i 's/do\.devicecheck=0/do.devicecheck=1/' anykernel.sh
        sed -i 's/device\.name1=.*/device.name1=timelm/' anykernel.sh
        sed -i 's/device\.name2=.*/device.name2=LMV600/' anykernel.sh
        sed -i 's/device\.name3=.*/device.name3=LMV600VM/' anykernel.sh
        sed -i 's/device\.name4=.*/device.name4=LMV600EA/' anykernel.sh
        sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
        sed -i 's/is_slot_device=.*/is_slot_device=1;/' anykernel.sh
        sed -i 's/kernel\.string=.*/kernel.string=SuKiSu-Ultra Kernel for LG V60/' anykernel.sh

        BOOT_DIR="../kernel/out/arch/arm64/boot"
        if [ -f "$BOOT_DIR/Image" ]; then
          cp "$BOOT_DIR/Image" .
        elif [ -f "$BOOT_DIR/Image.gz" ]; then
          cp "$BOOT_DIR/Image.gz" .
        elif [ -f "$BOOT_DIR/Image.gz-dtb" ]; then
          cp "$BOOT_DIR/Image.gz-dtb" .
        else
          echo "Tidak ada kernel image"
          exit 1
        fi

        ZIPNAME="SuKiSu-Ultra-V60-$(date +%Y%m%d-%H%M).zip"
        zip -r9 "../$ZIPNAME" . -x ".git/*" -x "README.md"
        echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV

    - name: ⬆️ Upload kernel ZIP
      if: steps.build.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: SuKiSu-Ultra-V60-Kernel
        path: SuKiSu-Ultra-V60-*.zip
        retention-days: 7

    - name: 📊 Ringkasan
      if: always()
      run: |
        if [ "${{ steps.build.outcome }}" == "success" ]; then
          echo "✅ BUILD BERHASIL"
        else
          echo "❌ BUILD GAGAL - Download artifact 'build-log'"
        fi
