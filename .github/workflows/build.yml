name: 🔨 Build LG V60 Kernel + SukiSU Ultra

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Branch kernel LineageOS'
        required: true
        default: 'lineage-22.2'
        type: choice
        options:
          - lineage-23.2
          - lineage-23.0
          - lineage-22.2

# ══════════════════════════════════════════════════════════════
# Job-level env
# ══════════════════════════════════════════════════════════════
env:
  ARCH: arm64
  SUBARCH: arm64
  CC: clang
  LD: ld.lld
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

    # ══════════════════════════════════════════════════════════
    # STEP 1: Setup Environment
    # ══════════════════════════════════════════════════════════

    - name: 📥 Checkout repository (untuk apply_hooks.py)
      uses: actions/checkout@v4

    - name: 🗑️ Free up disk space
      run: |
        echo "Disk sebelum cleanup:"
        df -h / | tail -1

        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /usr/local/.ghcup \
          /usr/share/swift \
          /opt/hostedtoolcache/CodeQL \
          /usr/local/share/boost

        sudo apt-get clean
        sudo apt-get autoremove -y

        echo "Disk setelah cleanup:"
        df -h / | tail -1

    - name: 📦 Install build dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          git bc bison flex libssl-dev libelf-dev \
          libncurses5-dev python3 python-is-python3 \
          zip unzip wget curl cpio kmod \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

    - name: ⚙️ Install Clang 17
      run: |
        wget -q https://apt.llvm.org/llvm.sh -O llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 17 all

        for tool in clang clang++ ld.lld llvm-ar llvm-nm \
                    llvm-objcopy llvm-objdump llvm-readelf \
                    llvm-strip llvm-ranlib; do
          if [ -f "/usr/bin/${tool}-17" ]; then
            sudo ln -sf "/usr/bin/${tool}-17" "/usr/local/bin/${tool}"
          fi
        done

        echo "Clang version:"
        clang --version | head -3
        echo ""
        echo "LLD version:"
        ld.lld --version

    # ══════════════════════════════════════════════════════════
    # STEP 2: Clone Kernel Source
    # ══════════════════════════════════════════════════════════

    - name: 📥 Clone kernel source
      run: |
        git clone --depth=1 \
          https://github.com/LineageOS/android_kernel_lge_sm8250 \
          -b ${{ github.event.inputs.kernel_branch }} kernel

        cd kernel
        echo "Kernel version:"
        head -3 Makefile | grep -E 'VERSION|PATCHLEVEL|SUBLEVEL' | \
          awk '{print $3}' | tr '\n' '.' | sed 's/\.$//'
        echo ""

    # ══════════════════════════════════════════════════════════
    # STEP 3: Inject SukiSU Ultra (Manual Method)
    #
    # FIX #2: Ganti relative symlink → absolute symlink
    #   Sebelum: ln -sf ../SukiSU/kernel kernelsu
    #   Sesudah: ln -sf "$(realpath ../SukiSU/kernel)" kernelsu
    #
    # Alasan: relative symlink "../SukiSU/kernel" di-resolve relatif
    # terhadap direktori TEMPAT symlink berada (drivers/).
    # Dalam konteks out-of-tree build (make O=out), beberapa versi
    # Kbuild/Android kernel fork mis-resolve relative symlink saat
    # membaca Makefile dari build tree. Absolute path eliminasi ambiguitas ini.
    # ══════════════════════════════════════════════════════════

    - name: 💉 Clone SukiSU Ultra source
      run: |
        cd kernel

        echo "▶ Cloning SukiSU Ultra repository..."
        if ! git clone --depth=1 \
          https://github.com/SukiSU-Ultra/SukiSU-Ultra SukiSU; then
          echo "❌ Gagal clone SukiSU Ultra repository!"
          exit 1
        fi

        echo "▶ Creating symlink (FIX #2: absolute path)..."
        cd drivers

        # FIX #2: Gunakan absolute path untuk symlink agar tidak
        # ada ambiguitas saat Kbuild resolve path dalam out-of-tree build.
        SUKISU_ABS="$(realpath ../SukiSU/kernel)"
        echo "  SukiSU absolute path: $SUKISU_ABS"
        ln -sf "$SUKISU_ABS" kernelsu
        cd ..

        # Verifikasi symlink
        if [ ! -L drivers/kernelsu ]; then
          echo "❌ Symlink gagal dibuat!"
          exit 1
        fi

        # Verifikasi target symlink dapat diakses (bukan dangling)
        if [ ! -d drivers/kernelsu ]; then
          echo "❌ Symlink ada tapi target tidak ditemukan (dangling symlink)!"
          echo "   Symlink points to: $(readlink drivers/kernelsu)"
          echo "   Resolved path:     $(readlink -f drivers/kernelsu)"
          exit 1
        fi

        echo "✅ Symlink: drivers/kernelsu -> $(readlink drivers/kernelsu)"
        ls -la drivers/kernelsu/

        # Tampilkan struktur SukiSU untuk verifikasi
        echo ""
        echo "▶ SukiSU kernel/ structure:"
        ls drivers/kernelsu/ | head -20

    - name: 🔧 Integrate SukiSU into build system
      run: |
        cd kernel

        echo "▶ Patching drivers/Makefile..."
        if ! grep -qx 'obj-y += kernelsu/' drivers/Makefile; then
          echo 'obj-y += kernelsu/' >> drivers/Makefile
          echo "  ✅ Added kernelsu to Makefile"
        else
          echo "  ⏭️  kernelsu sudah ada di Makefile"
        fi

        echo "▶ Patching drivers/Kconfig..."
        if ! grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
          if grep -q '^endmenu' drivers/Kconfig; then
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
            echo "  ✅ Added kernelsu to Kconfig (via sed before endmenu)"
          else
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
            echo "  ✅ Added kernelsu to Kconfig (appended to end)"
          fi
        else
          echo "  ⏭️  kernelsu sudah ada di Kconfig"
        fi

        echo ""
        echo "Verifikasi integrasi:"
        echo "  Makefile: $(grep 'kernelsu' drivers/Makefile)"
        echo "  Kconfig:  $(grep 'kernelsu' drivers/Kconfig)"

    # ══════════════════════════════════════════════════════════
    # STEP 4: Apply Manual Hooks
    # ══════════════════════════════════════════════════════════

    - name: 🔧 Apply kernel hooks
      run: |
        echo "▶ Running apply_hooks.py..."
        echo ""

        SCRIPT="$GITHUB_WORKSPACE/scripts/apply_hooks.py"
        KERNEL_DIR="$GITHUB_WORKSPACE/kernel"

        if [ ! -f "$SCRIPT" ]; then
          echo "❌ apply_hooks.py tidak ditemukan di: $SCRIPT"
          exit 1
        fi

        if ! python3 "$SCRIPT" "$KERNEL_DIR" 2>&1 | tee patch.log; then
          echo ""
          echo "╔═══════════════════════════════╗"
          echo "║  ❌ PATCH SCRIPT GAGAL        ║"
          echo "╚═══════════════════════════════╝"
          cat patch.log
          exit 1
        fi

        echo ""
        echo "▶ Validating critical patches..."

        CRITICAL_FILES=(
          "fs/exec.c:ksu_execveat_hook"
          "fs/open.c:ksu_handle_faccessat"
          "drivers/input/input.c:ksu_input_hook"
        )

        FAILED=0
        for entry in "${CRITICAL_FILES[@]}"; do
          FILE="${entry%%:*}"
          MARKER="${entry##*:}"

          if grep -q "$MARKER" "$KERNEL_DIR/$FILE" 2>/dev/null; then
            echo "  ✅ $FILE ($MARKER)"
          else
            echo "  ❌ CRITICAL: $FILE tidak memiliki $MARKER"
            FAILED=1
          fi
        done

        if [ $FAILED -eq 1 ]; then
          echo ""
          echo "❌ Patch kritis gagal! Build akan error."
          exit 1
        fi

        echo ""
        echo "✅ Semua patch kritis berhasil diaplikasikan"

    # ══════════════════════════════════════════════════════════
    # STEP 5: Configure Kernel
    # ══════════════════════════════════════════════════════════

    - name: 🏗️ Configure kernel
      run: |
        cd kernel

        echo "════════════════════════════════════════"
        echo "  [1/3] Base defconfig"
        echo "════════════════════════════════════════"

        make O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          vendor/kona-perf_defconfig

        echo ""
        echo "════════════════════════════════════════"
        echo "  [2/3] Merge device-specific config"
        echo "════════════════════════════════════════"

        TIMELM_CFG=""
        for cfg_path in \
          "arch/arm64/configs/vendor/timelm.config" \
          "arch/arm64/configs/timelm.config"; do
          if [ -f "$cfg_path" ]; then
            TIMELM_CFG="$cfg_path"
            break
          fi
        done

        if [ -n "$TIMELM_CFG" ]; then
          echo "  Using: $TIMELM_CFG"
          ./scripts/kconfig/merge_config.sh \
            -O out \
            out/.config \
            "$TIMELM_CFG"

          MERGE_EXIT=$?
          if [ $MERGE_EXIT -ne 0 ]; then
            echo "⚠️  merge_config.sh returned exit $MERGE_EXIT (non-fatal warning)"
          fi
        else
          echo "  ⚠️  timelm.config tidak ditemukan, skip merge"
        fi

        echo ""
        echo "════════════════════════════════════════"
        echo "  [3/3] Enable SukiSU Ultra configs"
        echo "════════════════════════════════════════"

        # FIX #5: Cek apakah KPROBES tersedia di arch ini.
        # Kona (SM8250) mendukung kprobes, tapi beberapa vendor defconfig
        # mematikannya. Aktifkan dulu, lalu cek hasilnya setelah olddefconfig.
        ./scripts/config --file out/.config \
          --enable CONFIG_KPROBES \
          --enable CONFIG_HAVE_KPROBES \
          --enable CONFIG_KPROBE_EVENTS \
          --enable CONFIG_EXT4_FS \
          --enable CONFIG_MODULES \
          --enable CONFIG_MODULE_UNLOAD \
          --enable CONFIG_OVERLAY_FS \
          --enable CONFIG_KSU

        # FIX #5: Set CONFIG_KSU_MANUAL_HOOK=y sebagai fallback
        # jika kernel tidak support kprobes secara penuh.
        # SukiSU Ultra mendukung mode manual hook tanpa kprobe.
        ./scripts/config --file out/.config \
          --enable CONFIG_KSU_MANUAL_HOOK 2>/dev/null || true

        make O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          olddefconfig

        echo ""
        echo "▶ Verifying SukiSU Ultra configs..."

        KSU_VAL=$(grep -E '^CONFIG_KSU=' out/.config | cut -d= -f2)
        if [ "$KSU_VAL" = "y" ] || [ "$KSU_VAL" = "m" ]; then
          echo "  ✅ CONFIG_KSU=${KSU_VAL} (SukiSU Ultra AKTIF)"
        else
          echo "  ❌ CONFIG_KSU tidak aktif! (nilai: '${KSU_VAL}')"
          echo ""
          echo "══ Debugging info ══"
          echo "1. Kconfig integration:"
          grep 'kernelsu' drivers/Kconfig || echo "   TIDAK ADA di drivers/Kconfig!"
          echo "2. SukiSU Kconfig file:"
          ls -la drivers/kernelsu/Kconfig || echo "   FILE TIDAK ADA!"
          echo "3. CONFIG_KSU dependency:"
          grep -A5 'config KSU' drivers/kernelsu/Kconfig || echo "   TIDAK BISA DIBACA!"
          echo "4. Dependency check:"
          echo "   CONFIG_KPROBES    = $(grep '^CONFIG_KPROBES=' out/.config || echo 'NOT SET')"
          echo "   CONFIG_EXT4_FS    = $(grep '^CONFIG_EXT4_FS=' out/.config || echo 'NOT SET')"
          echo "   CONFIG_MODULES    = $(grep '^CONFIG_MODULES=' out/.config || echo 'NOT SET')"
          echo "5. KSU-related lines in .config:"
          grep -i 'ksu\|kernelsu\|sukisu\|kprobes' out/.config || echo "   TIDAK ADA!"
          exit 1
        fi

        echo ""
        echo "Other important configs:"
        grep '^CONFIG_MODULES='       out/.config || echo "  CONFIG_MODULES not set"
        grep '^CONFIG_KPROBES='       out/.config || echo "  CONFIG_KPROBES not set"
        grep '^CONFIG_EXT4_FS='       out/.config || echo "  CONFIG_EXT4_FS not set"
        grep '^CONFIG_OVERLAY_FS='    out/.config || echo "  CONFIG_OVERLAY_FS not set"
        grep '^CONFIG_KSU_MANUAL'     out/.config || echo "  CONFIG_KSU_MANUAL_HOOK not set (OK jika kprobes aktif)"

    # ══════════════════════════════════════════════════════════
    # STEP 5b: Pre-build KSU module isolation test
    #
    # FIX #3 (BARU): Kompilasi drivers/kernelsu/ secara terpisah
    # SEBELUM full kernel build. Jika ada error di SukiSU (undefined
    # symbol, header tidak ditemukan, dll), error langsung terisolasi
    # di step ini — bukan tenggelam di tengah full build log 50k baris.
    #
    # Jika step ini PASS → lanjut full build dengan confidence tinggi.
    # Jika step ini FAIL → baca error di sini langsung, tidak perlu
    #   analisis build.log yang panjang.
    # ══════════════════════════════════════════════════════════

    - name: 🧪 Pre-build KSU module isolation test
      run: |
        cd kernel

        echo "════════════════════════════════════════"
        echo "  FIX #3: KSU Module Isolation Test"
        echo "  Tujuan: isolasi error SukiSU sebelum full build"
        echo "════════════════════════════════════════"
        echo ""

        # Compile HANYA drivers/kernelsu/ — bukan seluruh kernel.
        # Ini jauh lebih cepat (< 60 detik) dan langsung menampilkan
        # error jika ada masalah di SukiSU source.
        #
        # Note: Ini BUKAN module build (M=), ini subdir build.
        # Kbuild akan compile semua .c di drivers/kernelsu/ dan
        # link menjadi drivers/kernelsu/built-in.a
        set -o pipefail
        make O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          -j$(nproc) \
          drivers/kernelsu/ 2>&1 | tee ksu_build_test.log

        KSU_TEST_EXIT=${PIPESTATUS[0]}

        if [ $KSU_TEST_EXIT -ne 0 ]; then
          echo ""
          echo "╔═══════════════════════════════════════════╗"
          echo "║  ❌ KSU MODULE BUILD FAILED               ║"
          echo "║     Root cause terisolasi di step ini!    ║"
          echo "╚═══════════════════════════════════════════╝"
          echo ""
          echo "▶ Full error output:"
          echo "────────────────────────────────────────────"
          # FIX #1: Langsung print log ke stdout sebelum exit
          # Tidak ada truncation karena ini eksplisit cat, bukan streaming
          cat ksu_build_test.log
          echo "────────────────────────────────────────────"
          echo ""
          echo "▶ Error lines only:"
          grep -n -E 'error:|undefined reference|cannot find|No such file' ksu_build_test.log || echo "  (tidak ada pattern error standar — lihat full log di atas)"
          exit 1
        fi

        echo ""
        echo "✅ KSU module isolation test PASSED!"
        echo "   drivers/kernelsu/ berhasil dikompilasi"
        echo "   Lanjut ke full kernel build..."

    # ══════════════════════════════════════════════════════════
    # STEP 6: Build Kernel
    #
    # FIX #1 (KRITIS): Ekspos isi build.log ke stdout SEBELUM exit 1.
    # Masalah sebelumnya: error asli ada di build.log tapi tidak
    # ditampilkan ke GitHub Actions log karena output streaming
    # terpotong saat job gagal.
    #
    # Solusi: setelah BUILD_EXIT != 0, jalankan:
    #   1. grep untuk baris error pertama
    #   2. tampilkan konteks ±30 baris dari error tersebut
    #   3. tampilkan 60 baris terakhir log (untuk linker error yang
    #      biasanya muncul di akhir)
    # Semua ini SEBELUM exit 1 — sehingga GitHub Actions sempat
    # menangkap dan menampilkan output ini.
    # ══════════════════════════════════════════════════════════

    - name: 🔨 Compile kernel
      run: |
        cd kernel

        BUILD_START=$(date +%s)

        echo "════════════════════════════════════════"
        echo "  Starting kernel compilation (SukiSU Ultra)"
        echo "════════════════════════════════════════"
        echo "Compiler: $(clang --version | head -1)"
        echo "Cores:    $(nproc)"
        echo "Disk free: $(df -h / | tail -1 | awk '{print $4}')"
        echo "Time:     $(date '+%Y-%m-%d %H:%M:%S')"
        echo "════════════════════════════════════════"
        echo ""

        set -o pipefail

        timeout 90m make O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          -j$(nproc) \
          2>&1 | tee build.log

        # PENTING: Capture PIPESTATUS[0] SEGERA setelah pipeline,
        # sebelum command apapun (termasuk echo) me-reset $?.
        BUILD_EXIT=${PIPESTATUS[0]}

        BUILD_END=$(date +%s)
        BUILD_TIME=$(( BUILD_END - BUILD_START ))

        echo ""
        echo "════════════════════════════════════════"
        echo "  Build finished"
        echo "════════════════════════════════════════"
        echo "Exit code: $BUILD_EXIT"
        echo "Duration:  $(printf '%02d:%02d:%02d' $((BUILD_TIME/3600)) $((BUILD_TIME%3600/60)) $((BUILD_TIME%60)))"
        echo "Disk free: $(df -h / | tail -1 | awk '{print $4}')"
        echo "════════════════════════════════════════"
        echo ""

        if [ "$BUILD_EXIT" -ne 0 ]; then
          echo "╔════════════════════════════════════╗"
          echo "║   ❌ COMPILATION FAILED            ║"
          echo "╚════════════════════════════════════╝"
          echo ""

          # ── Disk space check ──────────────────────────────────
          AVAIL_KB=$(df / | tail -1 | awk '{print $4}')
          AVAIL_MB=$(( AVAIL_KB / 1024 ))
          if [ "$AVAIL_MB" -lt 500 ]; then
            echo "🚨 DISK SPACE KRITIS: ${AVAIL_MB}MB tersisa"
            echo "   Build mungkin gagal karena disk penuh"
            echo ""
          fi

          # ── FIX #1: Ekspos error ke stdout sebelum exit ────────
          if [ -f build.log ] && [ -s build.log ]; then

            # ── Bagian A: Linker errors (paling sering muncul di akhir) ──
            echo "▶ [A] LINKER ERRORS (last 80 lines of build.log):"
            echo "══════════════════════════════════════════════════"
            tail -80 build.log
            echo ""

            # ── Bagian B: First compiler error dengan context ──────
            echo "▶ [B] FIRST COMPILER ERROR + context:"
            echo "══════════════════════════════════════════════════"

            ERRLINE=$(grep -n \
              -E '^[^:]+\.(c|h|S):[0-9]+:[0-9]+: error:|make\[[0-9]+\]: \*\*\*|No space left|ld\.lld: error:|undefined reference' \
              build.log | head -1 | cut -d: -f1)

            if [ -n "$ERRLINE" ]; then
              echo "  → First error at line $ERRLINE of build.log"
              echo ""
              START=$(( ERRLINE > 20 ? ERRLINE - 20 : 1 ))
              END=$(( ERRLINE + 40 ))
              sed -n "${START},${END}p" build.log
            else
              echo "  (Tidak ada pola error standar ditemukan di build.log)"
            fi

            echo ""

            # ── Bagian C: Semua baris error (tanpa context, untuk overview) ──
            echo "▶ [C] ALL ERROR LINES (overview):"
            echo "══════════════════════════════════════════════════"
            grep -n -E 'error:|undefined reference|cannot find|No space left' build.log | head -50 || echo "  (tidak ada baris error)"

          else
            echo "❌ build.log tidak ada atau kosong!"
            echo "   Kemungkinan timeout terjadi sebelum make dimulai."
          fi

          exit 1
        fi

        # ── Verifikasi output ──────────────────────────────────
        IMAGES_FOUND=0
        echo "▶ Checking build artifacts:"
        for img in Image.gz-dtb Image.gz Image; do
          if [ -f "out/arch/arm64/boot/$img" ]; then
            SIZE=$(du -h "out/arch/arm64/boot/$img" | cut -f1)
            echo "  ✅ $img ($SIZE)"
            IMAGES_FOUND=1
          fi
        done

        if [ "$IMAGES_FOUND" -eq 0 ]; then
          echo ""
          echo "❌ Tidak ada kernel image yang dihasilkan!"
          ls -la out/arch/arm64/boot/ || echo "  Directory tidak ada!"
          exit 1
        fi

        echo ""
        echo "╔════════════════════════════════════╗"
        echo "║   ✅ BUILD SUCCESS (SukiSU Ultra)  ║"
        echo "╚════════════════════════════════════╝"

    # ══════════════════════════════════════════════════════════
    # STEP 7: Create Flashable ZIP
    # ══════════════════════════════════════════════════════════

    - name: 📦 Create AnyKernel3 flashable ZIP
      run: |
        echo "▶ Cloning AnyKernel3..."
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3

        cd AnyKernel3

        echo "▶ Configuring for LG V60 ThinQ (timelm)..."
        sed -i 's|do\.devicecheck=.*|do.devicecheck=1|' anykernel.sh
        sed -i 's|device\.name1=.*|device.name1=timelm|' anykernel.sh
        sed -i 's|device\.name2=.*|device.name2=lge_v60|' anykernel.sh
        sed -i 's|device\.name3=.*|device.name3=LM-V600|' anykernel.sh
        sed -i 's|device\.name4=.*|device.name4=LM-V600N|' anykernel.sh
        sed -i 's|device\.name5=.*|device.name5=|' anykernel.sh
        sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
        sed -i 's|is_slot_device=.*|is_slot_device=1;|' anykernel.sh

        BRANCH="${{ github.event.inputs.kernel_branch }}"
        KERNEL_STR="SukiSU Ultra for LG V60 ThinQ (${BRANCH})"
        sed -i "s|kernel\.string=.*|kernel.string=${KERNEL_STR}|" anykernel.sh

        echo "▶ Copying kernel image..."
        BOOT="../kernel/out/arch/arm64/boot"
        COPIED=0

        for img in Image.gz-dtb Image.gz Image; do
          if [ -f "$BOOT/$img" ]; then
            cp "$BOOT/$img" ./
            SIZE=$(du -h "$img" | cut -f1)
            echo "  ✅ $img copied ($SIZE)"
            COPIED=1
            break
          fi
        done

        if [ "$COPIED" -eq 0 ]; then
          echo "  ❌ No kernel image found!"
          exit 1
        fi

        echo "▶ Copying DTBs (if any)..."
        mkdir -p dtbs
        if [ -d "$BOOT/dts" ]; then
          DTB_COUNT=$(find "$BOOT/dts" -name "*.dtb" | wc -l)
          if [ "$DTB_COUNT" -gt 0 ]; then
            find "$BOOT/dts" -name "*.dtb" -exec cp {} dtbs/ \;
            echo "  ✅ $DTB_COUNT DTB files copied"
          else
            echo "  ℹ️  Direktori DTS ada tapi tidak ada file .dtb"
          fi
        else
          echo "  ℹ️  No DTS directory (DTBs mungkin bundled dalam Image)"
        fi

        echo "▶ Creating flashable ZIP..."
        BUILD_DATE=$(date +%Y%m%d-%H%M)
        ZIP_NAME="SukiSU-Ultra-V60-${BRANCH}-${BUILD_DATE}.zip"

        zip -r9 "../${ZIP_NAME}" . \
          -x ".git/*" \
          -x "README.md" \
          -x "*.placeholder" \
          -x ".gitignore"

        cd ..

        ZIP_SIZE=$(du -h "${ZIP_NAME}" | cut -f1)
        echo ""
        echo "╔════════════════════════════════════╗"
        echo "║   ✅ ZIP CREATED                   ║"
        echo "╚════════════════════════════════════╝"
        echo "File: ${ZIP_NAME}"
        echo "Size: ${ZIP_SIZE}"

    # ══════════════════════════════════════════════════════════
    # STEP 8: Upload Artifacts
    # ══════════════════════════════════════════════════════════

    - name: ⬆️ Upload kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: SukiSU-Ultra-V60-Kernel-${{ github.event.inputs.kernel_branch }}
        path: SukiSU-Ultra-V60-*.zip
        retention-days: 7
        compression-level: 0

    - name: ⬆️ Upload build logs & config
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ github.event.inputs.kernel_branch }}
        path: |
          kernel/build.log
          kernel/ksu_build_test.log
          patch.log
          kernel/out/.config
        retention-days: 7

    # ══════════════════════════════════════════════════════════
    # STEP 9: Summary
    # ══════════════════════════════════════════════════════════

    - name: 📊 Build summary
      if: always()
      run: |
        echo ""
        echo "════════════════════════════════════════════════════════"
        echo "               BUILD SUMMARY — SukiSU Ultra"
        echo "════════════════════════════════════════════════════════"
        echo ""

        if ls SukiSU-Ultra-V60-*.zip 1>/dev/null 2>&1; then
          echo "✅ Status: SUCCESS"
          echo ""
          echo "📦 Output files:"
          ls -lh SukiSU-Ultra-V60-*.zip
          echo ""
          echo "📥 Download Instructions:"
          echo "   1. Klik tab 'Summary' di bagian atas"
          echo "   2. Scroll ke bawah ke section 'Artifacts'"
          echo "   3. Download 'SukiSU-Ultra-V60-Kernel-...'"
          echo ""
          echo "📱 Installation (via TWRP/OrangeFox):"
          echo "   1. Reboot ke recovery mode"
          echo "   2. Install → Pilih file ZIP yang sudah didownload"
          echo "   3. Swipe to confirm flash"
          echo "   4. Reboot system"
          echo "   5. Install SukiSU Ultra Manager APK:"
          echo "      https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases"
          echo ""
          echo "⚠️  IMPORTANT:"
          echo "   - Pastikan backup boot.img sebelum flash!"
          echo "   - JANGAN gunakan KernelSU Manager — gunakan SukiSU Ultra Manager"
        else
          echo "❌ Status: FAILED"
          echo ""
          echo "📋 Troubleshooting Priority:"
          echo "   1. Cek log step 'Pre-build KSU module isolation test'"
          echo "      → Jika FAIL di sini, error ada di SukiSU source/hooks"
          echo "   2. Cek log step 'Compile kernel'"
          echo "      → Bagian [A] Last 80 lines, [B] First error, [C] All errors"
          echo "   3. Download artifact 'build-logs' → buka build.log"
          echo ""
          echo "🔧 Common Fixes:"
          echo "   - Undefined reference: hooks di fs/exec.c atau fs/open.c salah patch"
          echo "   - Kprobe error: CONFIG_KSU_MANUAL_HOOK=y sudah di-enable sebagai fallback"
          echo "   - Symlink error: FIX #2 sudah pakai absolute path"
          echo "   - Disk full: Hapus cache atau pilih runner dengan lebih space"
        fi

        echo ""
        echo "════════════════════════════════════════════════════════"
        echo "Branch:    ${{ github.event.inputs.kernel_branch }}"
        echo "Build time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
        echo "Run URL:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo "════════════════════════════════════════════════════════"
