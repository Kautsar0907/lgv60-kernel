name: 🔨 Build LG V60 Kernel + SuKiSu Ultra (Fixed)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Branch kernel LineageOS'
        required: true
        default: 'lineage-23.2'
        type: choice
        options:
          - lineage-23.2
          - lineage-22.2
          - lineage-21
      sukisu_variant:
        description: 'Varian SuKiSu (susfs-main = lebih lengkap, main = dasar)'
        required: true
        default: 'susfs-main'
        type: choice
        options:
          - susfs-main
          - main

jobs:
  build:
    name: Build Kernel LG V60
    runs-on: ubuntu-22.04

    steps:

    # -----------------------------------------------------------------
    # 1. Checkout repo ini (tempat workflow dan scripts/apply_hooks.py)
    # -----------------------------------------------------------------
    - name: 📥 Checkout repo workflow
      uses: actions/checkout@v4

    # -----------------------------------------------------------------
    # 2. Bersihkan disk agar cukup (kernel butuh ~15GB)
    # -----------------------------------------------------------------
    - name: 🗑️ Bersihkan disk
      run: |
        echo "Ruang disk sebelum:"
        df -h /
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /usr/local/.ghcup \
          /usr/share/swift
        sudo apt-get clean
        echo "Ruang disk setelah:"
        df -h /

    # -----------------------------------------------------------------
    # 3. Install tools build
    # -----------------------------------------------------------------
    - name: 📦 Install tools build
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          git bc bison flex libssl-dev libelf-dev \
          libncurses5-dev python3 python-is-python3 \
          zip unzip wget curl \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu \
          binutils-arm-linux-gnueabi

    - name: ⚙️ Install Clang 17
      run: |
        wget -q https://apt.llvm.org/llvm.sh -O llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 17
        for tool in clang clang++ ld.lld llvm-ar llvm-nm \
                    llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
          src="/usr/bin/${tool}-17"
          dst="/usr/local/bin/${tool}"
          [ -f "$src" ] && sudo ln -sf "$src" "$dst"
        done
        echo "Versi Clang:"
        clang --version

    # -----------------------------------------------------------------
    # 4. Download kernel source dari LineageOS
    # -----------------------------------------------------------------
    - name: 📋 Info branch tersedia
      run: |
        echo "============================================"
        echo "Branch yang tersedia di repo kernel V60:"
        echo "============================================"
        git ls-remote \
          https://github.com/LineageOS/android_kernel_lge_sm8250 \
          'refs/heads/lineage*' \
          | awk '{gsub("refs/heads/",""); print $2}' \
          | sort
        echo "============================================"
        echo "Anda memilih branch: ${{ github.event.inputs.kernel_branch }}"

    - name: 📥 Download kernel source
      run: |
        echo "Mendownload kernel source, harap tunggu (~10 menit)..."
        git clone --depth=1 \
          https://github.com/LineageOS/android_kernel_lge_sm8250 \
          -b ${{ github.event.inputs.kernel_branch }} \
          kernel
        echo "✅ Versi kernel yang didownload:"
        head -5 kernel/Makefile

    # -----------------------------------------------------------------
    # 5. Deteksi defconfig LG V60
    # -----------------------------------------------------------------
    - name: 🔍 Deteksi defconfig
      id: defconfig
      run: |
        echo "File defconfig yang tersedia:"
        find kernel/arch/arm64/configs -type f -name "*.config" -o \
             -type f -name "*defconfig" 2>/dev/null | sort
        echo ""

        if [ -f "kernel/arch/arm64/configs/vendor/timelm_defconfig" ]; then
          DEFCONFIG="vendor/timelm_defconfig"
        elif [ -f "kernel/arch/arm64/configs/timelm_defconfig" ]; then
          DEFCONFIG="timelm_defconfig"
        elif [ -f "kernel/arch/arm64/configs/vendor/kona-perf_defconfig" ]; then
          DEFCONFIG="vendor/kona-perf_defconfig"
        elif [ -f "kernel/arch/arm64/configs/kona-perf_defconfig" ]; then
          DEFCONFIG="kona-perf_defconfig"
        else
          DEFCONFIG=$(find kernel/arch/arm64/configs -type f \
            | grep -i "timelm\|kona" | head -1 \
            | sed 's|kernel/arch/arm64/configs/||')
          if [ -z "$DEFCONFIG" ]; then
            echo "❌ Defconfig tidak ditemukan otomatis!"
            exit 1
          fi
        fi

        echo "✅ Menggunakan defconfig: $DEFCONFIG"
        echo "defconfig=$DEFCONFIG" >> $GITHUB_OUTPUT

    # -----------------------------------------------------------------
    # 6. Inject SuKiSu Ultra
    # -----------------------------------------------------------------
    - name: 💉 Inject SuKiSu Ultra
      run: |
        cd kernel
        echo "Menambahkan SuKiSu Ultra (variant: ${{ github.event.inputs.sukisu_variant }})..."
        curl -LSs \
          "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
          | bash -s ${{ github.event.inputs.sukisu_variant }}
        echo "✅ SuKiSu Ultra berhasil di-inject"

    # -----------------------------------------------------------------
    # 7. Terapkan manual hooks (apply_hooks.py dari repo workflow)
    # -----------------------------------------------------------------
    - name: 🔧 Terapkan manual hooks ke kernel source
      run: |
        python3 scripts/apply_hooks.py kernel

    # =================================================================
    # 8. PERBAIKAN: Fix corrupted drivers/esoc/esoc.h
    #    (menambahkan #define ESOC_DBG yang hilang)
    # =================================================================
    - name: 🔧 Fix corrupted esoc.h (missing macro define)
      run: |
        cd kernel
        ESOC_H="drivers/esoc/esoc.h"
        if [ -f "$ESOC_H" ]; then
          echo "=== Memeriksa $ESOC_H sekitar baris 30-50 ==="
          sed -n '30,50p' "$ESOC_H"
          
          # Cek apakah ada baris 'do {' tanpa didahului #define
          if grep -q '^[[:space:]]*do {' "$ESOC_H" ; then
            echo "⚠️ Ditemukan 'do {' tanpa #define, memperbaiki..."
            cp "$ESOC_H" "$ESOC_H.bak"
            # Sisipkan #define ESOC_DBG sebelum baris 'do {'
            sed -i '/^[[:space:]]*do {/i #define ESOC_DBG(fmt, ...) \\' "$ESOC_H"
            echo "✅ Perbaikan diterapkan. File setelah perbaikan:"
            sed -n '30,50p' "$ESOC_H"
          else
            echo "✅ Tidak ditemukan pola 'do {' tanpa #define"
          fi
        else
          echo "⚠️ File $ESOC_H tidak ditemukan, skip"
        fi

    # -----------------------------------------------------------------
    # 9. Build kernel
    # -----------------------------------------------------------------
    - name: 🏗️ Build kernel (proses ~30-60 menit)
      run: |
        cd kernel

        export ARCH=arm64
        export SUBARCH=arm64

        echo "▶ Langkah 1/3: Generate konfigurasi..."
        make O=out \
          ARCH=arm64 \
          CC=clang \
          LLVM=1 \
          LLVM_IAS=1 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          ${{ steps.defconfig.outputs.defconfig }}

        echo "▶ Langkah 2/3: Aktifkan konfigurasi SuKiSu..."
        ./scripts/config --file out/.config \
          --enable  CONFIG_KSU \
          --enable  CONFIG_KSU_MANUAL_HOOK \
          --enable  CONFIG_KALLSYMS \
          --enable  CONFIG_KALLSYMS_ALL \
          --enable  CONFIG_KPM \
          --disable CONFIG_KPROBES

        make O=out \
          ARCH=arm64 \
          CC=clang \
          LLVM=1 \
          LLVM_IAS=1 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          olddefconfig

        echo "▶ Langkah 3/3: Kompilasi kernel..."
        make O=out \
          ARCH=arm64 \
          CC=clang \
          LLVM=1 \
          LLVM_IAS=1 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          -j$(nproc) 2>&1 | tee build.log

        # Verifikasi hasil
        if [ ! -d "out/arch/arm64/boot" ] || \
           ! ls out/arch/arm64/boot/Image* 2>/dev/null; then
          echo "❌ Build GAGAL — kernel image tidak ditemukan"
          echo "--- 80 baris terakhir build.log ---"
          tail -80 build.log
          exit 1
        fi

        echo "✅ Hasil build:"
        ls -lh out/arch/arm64/boot/

    # -----------------------------------------------------------------
    # 10. Upload build.log untuk debug (selalu)
    # -----------------------------------------------------------------
    - name: 📋 Upload build.log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: kernel/build.log
        retention-days: 3

    # -----------------------------------------------------------------
    # 11. Buat paket kernel AnyKernel3
    # -----------------------------------------------------------------
    - name: 📦 Buat paket kernel (AnyKernel3)
      run: |
        echo "Download AnyKernel3..."
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
        cd AnyKernel3

        sed -i 's/do\.devicecheck=0/do.devicecheck=1/'   anykernel.sh
        sed -i 's/device\.name1=.*/device.name1=timelm/' anykernel.sh
        sed -i 's/device\.name2=.*/device.name2=LMV600/' anykernel.sh
        sed -i 's/device\.name3=.*/device.name3=LMV600VM/' anykernel.sh
        sed -i 's/device\.name4=.*/device.name4=LMV600EA/' anykernel.sh
        sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
        sed -i 's/is_slot_device=.*/is_slot_device=1;/' anykernel.sh
        sed -i 's/kernel\.string=.*/kernel.string=SuKiSu-Ultra Kernel for LG V60 ThinQ/' anykernel.sh

        BOOT_DIR="../kernel/out/arch/arm64/boot"
        COPIED=false
        for img in Image Image.gz Image.gz-dtb; do
          if [ -f "$BOOT_DIR/$img" ]; then
            cp "$BOOT_DIR/$img" ./
            echo "✅ Copy $img"
            COPIED=true
            break
          fi
        done

        if [ "$COPIED" = false ]; then
          echo "❌ Kernel image tidak ditemukan!"
          ls -la "$BOOT_DIR/" || true
          exit 1
        fi

        mkdir -p dtbs
        if find "../kernel/out/arch/arm64/boot/dts" -name "*.dtb" 2>/dev/null | grep -q .; then
          find "../kernel/out/arch/arm64/boot/dts" -name "*.dtb" -exec cp {} dtbs/ \;
          echo "✅ DTB files di-copy"
        fi

        ZIPNAME="SuKiSu-Ultra-V60-$(date +%Y%m%d-%H%M).zip"
        zip -r9 "../$ZIPNAME" . -x ".git/*" -x "README.md" -x "*.placeholder"

        echo "✅ ZIP dibuat: $ZIPNAME"
        echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV

    # -----------------------------------------------------------------
    # 12. Upload artifact ZIP
    # -----------------------------------------------------------------
    - name: ⬆️ Upload kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: SuKiSu-Ultra-V60-Kernel
        path: SuKiSu-Ultra-V60-*.zip
        retention-days: 7

    # -----------------------------------------------------------------
    # 13. Ringkasan akhir
    # -----------------------------------------------------------------
    - name: 📊 Ringkasan hasil build
      if: always()
      run: |
        echo ""
        if ls SuKiSu-Ultra-V60-*.zip 2>/dev/null; then
          echo "╔══════════════════════════════════════╗"
          echo "║         ✅  BUILD BERHASIL            ║"
          echo "╚══════════════════════════════════════╝"
          echo "File ZIP:"
          ls -lh SuKiSu-Ultra-V60-*.zip
        else
          echo "╔══════════════════════════════════════╗"
          echo "║         ❌  BUILD GAGAL               ║"
          echo "╚══════════════════════════════════════╝"
          echo "Lihat artifact 'build-log' untuk detail error."
        fi
