name: 🔨 Build LG V60 Kernel + SuKiSu Ultra

# Cara pakai: Klik tab "Actions" → pilih workflow ini → klik "Run workflow"
on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Branch kernel LineageOS (lihat langkah 4 jika bingung)'
        required: true
        default: 'lineage-21'
        type: choice
        options:
          - lineage-21
          - lineage-22
          - lineage-22.2
      sukisu_variant:
        description: 'Varian SuKiSu (susfs-main = lebih lengkap, main = dasar)'
        required: true
        default: 'susfs-main'
        type: choice
        options:
          - susfs-main
          - main

jobs:
  build:
    name: Build Kernel LG V60
    runs-on: ubuntu-22.04

    steps:

    # ─────────────────────────────────────────────────────────────────────
    # TAHAP 1: Bersihkan disk agar cukup untuk build kernel
    # ─────────────────────────────────────────────────────────────────────
    - name: 📥 Checkout repo ini
      uses: actions/checkout@v4

    - name: 🗑️ Bersihkan disk (wajib, kernel butuh ~15GB)
      run: |
        echo "Ruang disk sebelum:"
        df -h /
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /usr/local/.ghcup \
          /usr/share/swift
        sudo apt-get clean
        echo "Ruang disk setelah:"
        df -h /

    # ─────────────────────────────────────────────────────────────────────
    # TAHAP 2: Install tools yang dibutuhkan untuk build
    # ─────────────────────────────────────────────────────────────────────
    - name: 📦 Install tools build
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          git bc bison flex libssl-dev libelf-dev \
          libncurses5-dev python3 python-is-python3 \
          zip unzip wget curl \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu \
          binutils-arm-linux-gnueabi

    - name: ⚙️ Install Clang 17 (compiler)
      run: |
        wget -q https://apt.llvm.org/llvm.sh -O llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 17
        # Buat symlink agar bisa dipanggil tanpa nomor versi
        for tool in clang clang++ ld.lld llvm-ar llvm-nm \
                    llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
          src="/usr/bin/${tool}-17"
          dst="/usr/local/bin/${tool}"
          [ -f "$src" ] && sudo ln -sf "$src" "$dst" && echo "  ✓ $tool"
        done
        echo "Versi Clang:"
        clang --version

    # ─────────────────────────────────────────────────────────────────────
    # TAHAP 3: Download source code kernel dari LineageOS
    # ─────────────────────────────────────────────────────────────────────
    - name: 📋 Tampilkan branch tersedia (informasi saja)
      run: |
        echo "============================================"
        echo "Branch yang tersedia di repo kernel V60:"
        echo "============================================"
        git ls-remote \
          https://github.com/LineageOS/android_kernel_lge_sm8250 \
          'refs/heads/lineage*' \
          | awk '{gsub("refs/heads/",""); print $2}' \
          | sort
        echo "============================================"
        echo "Anda memilih branch: ${{ github.event.inputs.kernel_branch }}"

    - name: 📥 Download kernel source LineageOS LG V60
      run: |
        echo "Mendownload kernel source, harap tunggu (~10 menit)..."
        git clone --depth=1 \
          https://github.com/LineageOS/android_kernel_lge_sm8250 \
          -b ${{ github.event.inputs.kernel_branch }} \
          kernel
        echo ""
        echo "✅ Versi kernel yang didownload:"
        head -5 kernel/Makefile

    # ─────────────────────────────────────────────────────────────────────
    # TAHAP 4: Deteksi file konfigurasi (defconfig) yang benar
    # ─────────────────────────────────────────────────────────────────────
    - name: 🔍 Deteksi defconfig LG V60
      id: defconfig
      run: |
        echo "File defconfig yang tersedia:"
        find kernel/arch/arm64/configs -type f -name "*.config" -o \
             -type f -name "*defconfig" 2>/dev/null | sort
        echo ""

        # Cari defconfig dengan prioritas: timelm > kona
        if [ -f "kernel/arch/arm64/configs/vendor/timelm_defconfig" ]; then
          DEFCONFIG="vendor/timelm_defconfig"
        elif [ -f "kernel/arch/arm64/configs/timelm_defconfig" ]; then
          DEFCONFIG="timelm_defconfig"
        elif [ -f "kernel/arch/arm64/configs/vendor/kona-perf_defconfig" ]; then
          DEFCONFIG="vendor/kona-perf_defconfig"
        elif [ -f "kernel/arch/arm64/configs/kona-perf_defconfig" ]; then
          DEFCONFIG="kona-perf_defconfig"
        else
          # Cari file yang mengandung "timelm" atau "kona"
          DEFCONFIG=$(find kernel/arch/arm64/configs -type f \
            | grep -i "timelm\|kona" | head -1 \
            | sed 's|kernel/arch/arm64/configs/||')
          if [ -z "$DEFCONFIG" ]; then
            echo "❌ Defconfig tidak ditemukan otomatis!"
            echo "   Lihat daftar file di atas dan isi manual di workflow."
            exit 1
          fi
        fi

        echo "✅ Menggunakan defconfig: $DEFCONFIG"
        echo "defconfig=$DEFCONFIG" >> $GITHUB_OUTPUT

    # ─────────────────────────────────────────────────────────────────────
    # TAHAP 5: Tambahkan SuKiSu Ultra ke dalam kernel source
    # ─────────────────────────────────────────────────────────────────────
    - name: 💉 Inject SuKiSu Ultra ke kernel source
      run: |
        cd kernel
        echo "Menambahkan SuKiSu Ultra (variant: ${{ github.event.inputs.sukisu_variant }})..."
        curl -LSs \
          "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
          | bash -s ${{ github.event.inputs.sukisu_variant }}
        echo ""
        echo "✅ SuKiSu Ultra berhasil di-inject"
        echo "File yang ditambahkan:"
        ls KernelSU/

    # ─────────────────────────────────────────────────────────────────────
    # TAHAP 6: Terapkan patch manual hooks (perlu untuk kernel non-GKI)
    # ─────────────────────────────────────────────────────────────────────
    - name: 🔧 Terapkan manual hooks ke kernel source
      run: |
        python3 scripts/apply_hooks.py kernel

    # ─────────────────────────────────────────────────────────────────────
    # TAHAP 7: Build (kompilasi) kernel
    # ─────────────────────────────────────────────────────────────────────
    - name: 🏗️ Build kernel (proses ini ~30-60 menit)
      run: |
        cd kernel

        # Variabel build
        export ARCH=arm64
        export SUBARCH=arm64

        echo "▶ Langkah 1/3: Generate konfigurasi..."
        make O=out \
          ARCH=arm64 \
          CC=clang \
          LLVM=1 \
          LLVM_IAS=1 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          ${{ steps.defconfig.outputs.defconfig }}

        echo ""
        echo "▶ Langkah 2/3: Aktifkan konfigurasi SuKiSu..."
        ./scripts/config --file out/.config \
          --enable  CONFIG_KSU \
          --enable  CONFIG_KSU_MANUAL_HOOK \
          --enable  CONFIG_KALLSYMS \
          --enable  CONFIG_KALLSYMS_ALL \
          --enable  CONFIG_KPM \
          --disable CONFIG_KPROBES

        # Selesaikan dependensi konfigurasi otomatis
        make O=out \
          ARCH=arm64 \
          CC=clang \
          LLVM=1 \
          LLVM_IAS=1 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          olddefconfig

        echo ""
        echo "▶ Langkah 3/3: Kompilasi kernel (harap tunggu)..."
        make O=out \
          ARCH=arm64 \
          CC=clang \
          LLVM=1 \
          LLVM_IAS=1 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          -j$(nproc) 2>&1 | tee build.log

        # Verifikasi hasil
        echo ""
        echo "Hasil kompilasi:"
        ls -lh out/arch/arm64/boot/ || true

    # ─────────────────────────────────────────────────────────────────────
    # TAHAP 8: Buat file ZIP yang bisa di-flash via TWRP
    # ─────────────────────────────────────────────────────────────────────
    - name: 📦 Buat paket kernel (AnyKernel3)
      run: |
        echo "Download AnyKernel3..."
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
        cd AnyKernel3

        # Konfigurasi untuk LG V60 ThinQ
        sed -i 's/do\.devicecheck=0/do.devicecheck=1/'   anykernel.sh
        sed -i 's/device\.name1=.*/device.name1=timelm/' anykernel.sh
        sed -i 's/device\.name2=.*/device.name2=LMV600/' anykernel.sh
        sed -i 's/device\.name3=.*/device.name3=LMV600VM/' anykernel.sh
        sed -i 's/device\.name4=.*/device.name4=LMV600EA/' anykernel.sh
        sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
        sed -i 's/is_slot_device=.*/is_slot_device=1;/' anykernel.sh
        sed -i 's/kernel\.string=.*/kernel.string=SuKiSu-Ultra Kernel for LG V60 ThinQ/' anykernel.sh

        # Copy kernel image (coba semua format yang mungkin)
        echo "Mencari kernel image..."
        BOOT_DIR="../kernel/out/arch/arm64/boot"
        COPIED=false
        for img in Image Image.gz Image.gz-dtb; do
          if [ -f "$BOOT_DIR/$img" ]; then
            cp "$BOOT_DIR/$img" ./
            echo "  ✅ Berhasil copy: $img"
            COPIED=true
            break
          fi
        done

        if [ "$COPIED" = false ]; then
          echo "❌ Kernel image tidak ditemukan! Build mungkin gagal."
          ls -la "$BOOT_DIR/" || echo "Folder boot tidak ada"
          exit 1
        fi

        # Copy DTB files jika ada
        mkdir -p dtbs
        if find "../kernel/out/arch/arm64/boot/dts" -name "*.dtb" 2>/dev/null | grep -q .; then
          find "../kernel/out/arch/arm64/boot/dts" -name "*.dtb" -exec cp {} dtbs/ \;
          echo "  ✅ DTB files di-copy"
        else
          echo "  ℹ️ Tidak ada DTB files terpisah (normal)"
        fi

        # Buat ZIP dengan nama + tanggal
        ZIPNAME="SuKiSu-Ultra-V60-$(date +%Y%m%d-%H%M).zip"
        zip -r9 "../$ZIPNAME" . -x ".git/*" -x "README.md" -x "*.placeholder"

        echo ""
        echo "✅ File ZIP berhasil dibuat:"
        ls -lh "../$ZIPNAME"
        echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV

    # ─────────────────────────────────────────────────────────────────────
    # TAHAP 9: Upload hasil agar bisa didownload
    # ─────────────────────────────────────────────────────────────────────
    - name: ⬆️ Upload kernel ZIP (bisa didownload 7 hari)
      uses: actions/upload-artifact@v4
      with:
        name: SuKiSu-Ultra-V60-Kernel
        path: SuKiSu-Ultra-V60-*.zip
        retention-days: 7

    # ─────────────────────────────────────────────────────────────────────
    # RINGKASAN: Selalu tampilkan hasil di akhir
    # ─────────────────────────────────────────────────────────────────────
    - name: 📊 Ringkasan hasil build
      if: always()
      run: |
        echo ""
        echo "╔══════════════════════════════════════╗"
        if ls SuKiSu-Ultra-V60-*.zip 2>/dev/null; then
          echo "║         ✅  BUILD BERHASIL            ║"
          echo "╚══════════════════════════════════════╝"
          echo ""
          echo "File ZIP:"
          ls -lh SuKiSu-Ultra-V60-*.zip
          echo ""
          echo "→ Cara download:"
          echo "  1. Klik tab 'Summary' di halaman ini"
          echo "  2. Scroll ke bawah, lihat bagian 'Artifacts'"
          echo "  3. Klik nama file untuk download"
        else
          echo "║         ❌  BUILD GAGAL               ║"
          echo "╚══════════════════════════════════════╝"
          echo ""
          echo "50 baris terakhir dari log build:"
          tail -50 kernel/build.log 2>/dev/null || echo "(log tidak ditemukan)"
        fi
