name: 🔨 Build LG V60 Kernel + SuKiSu Ultra

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Branch kernel LineageOS'
        required: true
        default: 'lineage-23.2'
        type: choice
        options:
          - lineage-23.2
          - lineage-23.0
          - lineage-22.2

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: 📥 Checkout repo
      uses: actions/checkout@v4

    - name: 🗑️ Bebaskan disk
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache
        sudo apt-get clean
        df -h / | tail -1

    - name: 📦 Install tools
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          git bc bison flex libssl-dev libelf-dev libncurses5-dev \
          python3 python-is-python3 zip unzip wget curl \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

    - name: ⚙️ Install Clang 17
      run: |
        wget -q https://apt.llvm.org/llvm.sh -O llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 17
        for tool in clang clang++ ld.lld llvm-ar llvm-nm \
                    llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
          [ -f "/usr/bin/${tool}-17" ] && \
            sudo ln -sf "/usr/bin/${tool}-17" "/usr/local/bin/${tool}"
        done
        clang --version | head -1

    - name: 📥 Clone kernel source (branch ${{ github.event.inputs.kernel_branch }})
      run: |
        git clone --depth=1 \
          https://github.com/LineageOS/android_kernel_lge_sm8250 \
          -b ${{ github.event.inputs.kernel_branch }} kernel
        echo "Kernel version: $(head -3 kernel/Makefile | grep -E 'VERSION|PATCHLEVEL|SUBLEVEL' | awk '{print $3}' | tr '\n' '.' | sed 's/\.$//')"

    # ── PENTING: Inject SuKiSu branch "builtin" (bukan main/susfs-main) ──────
    # Branch "builtin" = untuk non-GKI kernel, tidak perlu KPROBES
    - name: 💉 Inject SuKiSu Ultra (branch builtin)
      run: |
        cd kernel
        curl -LSs \
          "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
          | bash -s builtin
        echo ""
        echo "Verifikasi integrasi:"
        echo "  drivers/kernelsu symlink: $(ls -la drivers/kernelsu 2>/dev/null || echo 'TIDAK ADA')"
        echo "  Makefile entry: $(grep 'kernelsu' drivers/Makefile 2>/dev/null || echo 'TIDAK ADA')"
        echo "  Kconfig entry: $(grep 'kernelsu' drivers/Kconfig 2>/dev/null || echo 'TIDAK ADA')"

    - name: 🔧 Terapkan manual hooks ke kernel source
      run: |
        python3 scripts/apply_hooks.py kernel

    - name: 🏗️ Build kernel
      run: |
        set -e
        set -o pipefail
        cd kernel

        echo "💾 Disk tersedia: $(df -h / | tail -1 | awk '{print $4}')"

        # ── [1/4] Generate .config dari kona-perf_defconfig ──
        echo ""
        echo "▶ [1/4] Base defconfig: vendor/kona-perf_defconfig"
        make O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          vendor/kona-perf_defconfig

        # ── [2/4] Merge timelm.config fragment (konfigurasi khusus LG V60) ──
        echo ""
        echo "▶ [2/4] Merge timelm.config fragment"
        ./scripts/kconfig/merge_config.sh \
          -m -O out/ \
          out/.config \
          arch/arm64/configs/vendor/timelm.config
        echo "  Fragment timelm.config berhasil di-merge"

        # ── [3/4] Tambahkan KSU configs ──
        echo ""
        echo "▶ [3/4] Aktifkan KSU configs"
        ./scripts/config --file out/.config \
          --enable  CONFIG_KSU \
          --enable  CONFIG_KPM

        # Resolve semua dependensi otomatis
        make O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          olddefconfig

        # Konfirmasi KSU aktif setelah olddefconfig
        echo "  CONFIG_KSU  = $(grep '^CONFIG_KSU=' out/.config || echo 'TIDAK DITEMUKAN')"
        echo "  CONFIG_KPM  = $(grep '^CONFIG_KPM=' out/.config || echo 'TIDAK DITEMUKAN')"

        # ── [4/4] Kompilasi ──
        echo ""
        echo "▶ [4/4] Kompilasi kernel (~30-50 menit)..."
        echo "💾 Disk sebelum build: $(df -h / | tail -1 | awk '{print $4}')"
        make O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          -j$(nproc) 2>&1 | tee build.log
        BUILD_EXIT=${PIPESTATUS[0]}

        echo ""
        echo "💾 Disk setelah build: $(df -h / | tail -1 | awk '{print $4}')"

        # ── Cek hasil ──
        if [ $BUILD_EXIT -ne 0 ] || ! ls out/arch/arm64/boot/Image* 2>/dev/null; then
          echo ""
          echo "❌ BUILD GAGAL (exit: $BUILD_EXIT)"
          AVAIL=$(df / | tail -1 | awk '{print $4}')
          [ "$AVAIL" -lt 512000 ] && \
            echo "🚨 DISK HAMPIR HABIS (${AVAIL}KB) — kemungkinan penyebab"
          echo ""
          echo "══ ERROR PERTAMA ══"
          ERRLINE=$(grep -nE \
            "error:|Error [0-9]+|fatal error:|undefined reference|No rule to make|No space left|cannot open|ld.lld:" \
            build.log \
            | grep -vE "Werror|werror|^[[:space:]]+(CC|AR|LD|AS|GZIP|UPD)" \
            | head -1 | cut -d: -f1)
          if [ -n "$ERRLINE" ]; then
            START=$(( ERRLINE > 8 ? ERRLINE - 8 : 1 ))
            sed -n "${START},$((ERRLINE + 20))p" build.log
          else
            echo "(tidak ada error eksplisit di log)"
            grep "make\[" build.log | grep -vE "Entering|Leaving" | tail -5
            echo "---"
            TOTAL=$(wc -l < build.log)
            MID=$(( TOTAL / 2 ))
            echo "Tengah log (baris $((MID-15)) - $((MID+15))):"
            sed -n "$((MID-15)),$((MID+15))p" build.log
          fi
          exit 1
        fi

        echo "✅ Build sukses!"
        ls -lh out/arch/arm64/boot/

    - name: 📋 Upload build.log (selalu)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: kernel/build.log
        retention-days: 3

    - name: 📦 Buat paket AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
        cd AnyKernel3
        sed -i 's/do\.devicecheck=0/do.devicecheck=1/'     anykernel.sh
        sed -i 's/device\.name1=.*/device.name1=timelm/'   anykernel.sh
        sed -i 's/device\.name2=.*/device.name2=LMV600/'   anykernel.sh
        sed -i 's/device\.name3=.*/device.name3=LMV600VM/' anykernel.sh
        sed -i 's/device\.name4=.*/device.name4=LMV600EA/' anykernel.sh
        sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
        sed -i 's/is_slot_device=.*/is_slot_device=1;/'    anykernel.sh
        sed -i 's/kernel\.string=.*/kernel.string=SuKiSu-Ultra Builtin for LG V60 ThinQ/' anykernel.sh

        BOOT="../kernel/out/arch/arm64/boot"
        for img in Image Image.gz Image.gz-dtb; do
          [ -f "$BOOT/$img" ] && cp "$BOOT/$img" ./ && echo "✅ $img di-copy" && break
        done
        mkdir -p dtbs
        find "$BOOT/dts" -name "*.dtb" -exec cp {} dtbs/ \; 2>/dev/null || true

        ZIP="SuKiSu-Ultra-V60-$(date +%Y%m%d-%H%M).zip"
        zip -r9 "../$ZIP" . -x ".git/*" -x "README.md" -x "*.placeholder"
        echo "✅ ZIP: $ZIP ($(du -h ../$ZIP | cut -f1))"

    - name: ⬆️ Upload kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: SuKiSu-Ultra-V60-Kernel
        path: SuKiSu-Ultra-V60-*.zip
        retention-days: 7

    - name: 📊 Ringkasan
      if: always()
      run: |
        echo ""
        if ls SuKiSu-Ultra-V60-*.zip 2>/dev/null; then
          echo "╔══════════════════════╗"
          echo "║   ✅ BUILD BERHASIL  ║"
          echo "╚══════════════════════╝"
          ls -lh SuKiSu-Ultra-V60-*.zip
          echo ""
          echo "→ Download ZIP di tab 'Summary' → bagian 'Artifacts'"
        else
          echo "╔══════════════════════╗"
          echo "║   ❌ BUILD GAGAL     ║"
          echo "╚══════════════════════╝"
          echo "→ Download 'build-log' untuk melihat error lengkap"
        fi
