name: 🔨 Build LG V60 Kernel + SukiSU Ultra + SUSFS

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Branch kernel LineageOS'
        required: true
        default: 'lineage-22.2'
        type: choice
        options:
          - lineage-23.2
          - lineage-23.0
          - lineage-22.2

env:
  ARCH: arm64
  SUBARCH: arm64
  CC: clang
  LD: ld.lld
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

    # ══════════════════════════════════════════════════════════
    # STEP 1: Setup Environment
    # ══════════════════════════════════════════════════════════

    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🗑️ Free up disk space
      run: |
        echo "Disk sebelum cleanup:"
        df -h / | tail -1
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /usr/local/.ghcup \
          /usr/share/swift \
          /opt/hostedtoolcache/CodeQL \
          /usr/local/share/boost
        sudo apt-get clean
        sudo apt-get autoremove -y
        echo "Disk setelah cleanup:"
        df -h / | tail -1

    - name: 📦 Install build dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          git bc bison flex libssl-dev libelf-dev \
          libncurses5-dev python3 python-is-python3 \
          zip unzip wget curl cpio kmod \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

    - name: ⚙️ Install Clang 17
      run: |
        wget -q https://apt.llvm.org/llvm.sh -O llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 17 all
        for tool in clang clang++ ld.lld llvm-ar llvm-nm \
                    llvm-objcopy llvm-objdump llvm-readelf \
                    llvm-strip llvm-ranlib; do
          if [ -f "/usr/bin/${tool}-17" ]; then
            sudo ln -sf "/usr/bin/${tool}-17" "/usr/local/bin/${tool}"
          fi
        done
        echo "Clang version:"; clang --version | head -3
        echo "LLD version:";   ld.lld --version

    # ══════════════════════════════════════════════════════════
    # STEP 2: Clone Kernel Source
    # ══════════════════════════════════════════════════════════

    - name: 📥 Clone kernel source
      run: |
        git clone --depth=1 \
          https://github.com/LineageOS/android_kernel_lge_sm8250 \
          -b ${{ github.event.inputs.kernel_branch }} kernel
        cd kernel
        echo "Kernel version:"
        head -3 Makefile | grep -E 'VERSION|PATCHLEVEL|SUBLEVEL' | \
          awk '{print $3}' | tr '\n' '.' | sed 's/\.$//'
        echo ""

    # ══════════════════════════════════════════════════════════
    # STEP 3: Clone SukiSU Ultra
    # ══════════════════════════════════════════════════════════

    - name: 💉 Clone & integrate SukiSU Ultra
      run: |
        cd kernel

        echo "════════════════════════════════════════"
        echo "  Cloning SukiSU Ultra"
        echo "════════════════════════════════════════"
        if ! git clone --depth=1 \
          https://github.com/SukiSU-Ultra/SukiSU-Ultra SukiSU; then
          echo "❌ Gagal clone SukiSU Ultra!"
          exit 1
        fi

        echo ""
        echo "▶ SukiSU Ultra repo structure:"
        find SukiSU -maxdepth 2 -type d | sort
        echo ""

        # ─────────────────────────────────────────────────────
        # Auto-detect kernel source dir di dalam SukiSU repo
        # SukiSU Ultra menggunakan layout modular, bukan
        # monolitik seperti KernelSU lama.
        # ─────────────────────────────────────────────────────
        SUKISU_SRC=""
        for candidate in "SukiSU/kernel" "SukiSU"; do
          if [ -f "${candidate}/Kconfig" ]; then
            SUKISU_SRC="${candidate}"
            echo "✅ SukiSU kernel src: ${candidate}"
            break
          fi
        done

        if [ -z "$SUKISU_SRC" ]; then
          echo "❌ Tidak menemukan Kconfig di SukiSU repo!"
          find SukiSU -name 'Kconfig' | head -10
          exit 1
        fi

        echo ""
        echo "▶ Copying SukiSU → drivers/kernelsu/ ..."
        rm -rf drivers/kernelsu
        cp -r "${SUKISU_SRC}" drivers/kernelsu

        echo ""
        echo "▶ Verifying copy — critical files:"
        for f in Kconfig; do
          if [ -f "drivers/kernelsu/${f}" ]; then
            echo "  ✅ drivers/kernelsu/${f}"
          else
            echo "  ❌ drivers/kernelsu/${f} MISSING"
            exit 1
          fi
        done

        echo ""
        echo "▶ Full directory map of drivers/kernelsu/:"
        find drivers/kernelsu -type f | sort | head -60

    # ══════════════════════════════════════════════════════════
    # STEP 4: Generate Kbuild + Integrate Build System
    #
    # FIX RC-1: Hapus grep -v 'policy' yang memfilter hasil valid
    # FIX RC-2: Generate Kbuild baru, bukan inject ke standalone Makefile
    # FIX RC-3: Makefile SukiSU adalah out-of-tree — gunakan Kbuild terpisah
    #
    # PENDEKATAN:
    #   Generate drivers/kernelsu/Kbuild secara programatik berdasarkan
    #   .c files aktual yang ada, dengan ccflags yang cover semua
    #   subdirektori header SukiSU Ultra.
    # ══════════════════════════════════════════════════════════

    - name: 🔧 Generate Kbuild & integrate SukiSU Ultra into kernel build
      run: |
        cd kernel

        KSUDIR="drivers/kernelsu"

        echo "════════════════════════════════════════"
        echo "  Generating Kbuild for SukiSU Ultra"
        echo "  (FIX RC-1/RC-2/RC-3 dari v5)"
        echo "════════════════════════════════════════"

        # ─────────────────────────────────────────────────────
        # Scan semua .c files yang ada di drivers/kernelsu/
        # Ini menggantikan asumsi hardcoded file list.
        # ─────────────────────────────────────────────────────
        echo "▶ Scanning .c files di ${KSUDIR}/..."

        C_FILES=$(find "${KSUDIR}" -name '*.c' -not -name '*.mod.c' \
          | sed "s|${KSUDIR}/||" | sort)

        if [ -z "$C_FILES" ]; then
          echo "❌ Tidak ada .c file ditemukan di ${KSUDIR}!"
          exit 1
        fi

        echo "  Ditemukan $(echo "$C_FILES" | wc -l) .c file(s):"
        echo "$C_FILES" | sed 's/^/    /'

        # ─────────────────────────────────────────────────────
        # Scan subdirektori header untuk ccflags
        # Semua subdirektori yang mengandung .h file
        # ─────────────────────────────────────────────────────
        echo ""
        echo "▶ Scanning header directories..."

        HDR_DIRS=$(find "${KSUDIR}" -name '*.h' \
          | xargs -I{} dirname {} \
          | sort -u \
          | sed "s|${KSUDIR}|drivers/kernelsu|")

        echo "  Include paths:"
        echo "$HDR_DIRS" | sed 's/^/    -I$(srctree)\//'

        # ─────────────────────────────────────────────────────
        # Generate Kbuild file
        # Kernel build system membaca 'Kbuild' dengan prioritas
        # lebih tinggi dari 'Makefile' dalam direktori yang sama.
        # ─────────────────────────────────────────────────────
        KBUILD_FILE="${KSUDIR}/Kbuild"
        echo ""
        echo "▶ Writing ${KBUILD_FILE}..."

        {
          echo "# Kbuild — Auto-generated by CI for SukiSU Ultra"
          echo "# DO NOT EDIT MANUALLY"
          echo "# Generated: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo ""

          # ccflags: root + semua subdirektori header
          echo "ccflags-y += \\"
          echo "    -I\$(srctree)/drivers/kernelsu \\"
          # Tambah setiap header subdir yang terdeteksi
          while IFS= read -r hdir; do
            REL="${hdir#drivers/kernelsu}"
            if [ -n "$REL" ]; then
              echo "    -I\$(srctree)/drivers/kernelsu${REL} \\"
            fi
          done <<< "$HDR_DIRS"
          echo ""

          # Definisi objek kernel
          echo "obj-\$(CONFIG_KSU) += kernelsu.o"
          echo ""
          echo "kernelsu-y := \\"

          # Daftar semua .c file sebagai object
          TOTAL=$(echo "$C_FILES" | wc -l)
          COUNT=0
          while IFS= read -r cf; do
            COUNT=$((COUNT + 1))
            OBJ="${cf%.c}.o"
            if [ "$COUNT" -lt "$TOTAL" ]; then
              echo "    ${OBJ} \\"
            else
              echo "    ${OBJ}"
            fi
          done <<< "$C_FILES"

          echo ""
          echo "# End of Kbuild"
        } > "$KBUILD_FILE"

        echo ""
        echo "▶ Generated Kbuild content:"
        echo "────────────────────────────────────────"
        cat "$KBUILD_FILE"
        echo "────────────────────────────────────────"

        # ─────────────────────────────────────────────────────
        # Mandatory verification: Kbuild harus valid
        # ─────────────────────────────────────────────────────
        echo ""
        echo "▶ Mandatory Kbuild verification..."

        VERIFY_FAIL=0

        grep -q 'obj-$(CONFIG_KSU)' "$KBUILD_FILE" || {
          echo "  ❌ obj-\$(CONFIG_KSU) tidak ditemukan!"
          VERIFY_FAIL=1
        }
        grep -q 'ccflags-y' "$KBUILD_FILE" || {
          echo "  ❌ ccflags-y tidak ditemukan!"
          VERIFY_FAIL=1
        }
        grep -q 'kernelsu-y' "$KBUILD_FILE" || {
          echo "  ❌ kernelsu-y tidak ditemukan!"
          VERIFY_FAIL=1
        }
        grep -q 'drivers/kernelsu' "$KBUILD_FILE" || {
          echo "  ❌ ccflags path drivers/kernelsu tidak ada!"
          VERIFY_FAIL=1
        }

        [ "$VERIFY_FAIL" -eq 1 ] && {
          echo "❌ Kbuild verification FAILED — aborting"
          exit 1
        }
        echo "  ✅ Kbuild verification PASSED"

        # ─────────────────────────────────────────────────────
        # Patch drivers/Makefile — obj-$(CONFIG_KSU)
        # ─────────────────────────────────────────────────────
        echo ""
        echo "▶ Patching drivers/Makefile..."
        if ! grep -q 'kernelsu' drivers/Makefile; then
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          echo "  ✅ Added: obj-\$(CONFIG_KSU) += kernelsu/"
        else
          if grep -qF 'obj-y += kernelsu/' drivers/Makefile; then
            sed -i 's|obj-y += kernelsu/|obj-$(CONFIG_KSU) += kernelsu/|g' \
              drivers/Makefile
            echo "  ✅ Fixed: obj-y → obj-\$(CONFIG_KSU)"
          else
            echo "  ⏭️  kernelsu entry sudah benar"
            grep 'kernelsu' drivers/Makefile
          fi
        fi

        # ─────────────────────────────────────────────────────
        # Patch drivers/Kconfig
        # ─────────────────────────────────────────────────────
        echo ""
        echo "▶ Patching drivers/Kconfig..."
        if ! grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
          if grep -q '^endmenu' drivers/Kconfig; then
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' \
              drivers/Kconfig
            echo "  ✅ Added kernelsu Kconfig (before endmenu)"
          else
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
            echo "  ✅ Added kernelsu Kconfig (appended)"
          fi
        else
          echo "  ⏭️  kernelsu sudah ada di drivers/Kconfig"
        fi

        # ─────────────────────────────────────────────────────
        # Integration summary
        # ─────────────────────────────────────────────────────
        echo ""
        echo "════════ Integration Summary ════════"
        echo "drivers/Makefile:"
        grep 'kernelsu' drivers/Makefile
        echo "drivers/Kconfig:"
        grep 'kernelsu' drivers/Kconfig
        echo "Kbuild file size:"
        wc -l "$KBUILD_FILE"
        echo "Kbuild obj count:"
        grep -c '\.o' "$KBUILD_FILE" || true
        echo "CONFIG_KSU in kernelsu/Kconfig:"
        grep -A 5 '^config KSU$' drivers/kernelsu/Kconfig \
          || echo "  (tidak ditemukan — cek nama config)"
        echo "═════════════════════════════════════"

    # ══════════════════════════════════════════════════════════
    # STEP 5: Clone & Apply SUSFS
    # SUSFS = SU Filesystem — menyembunyikan mount & path
    # dari deteksi anti-root. Wajib untuk SukiSU Ultra.
    # ══════════════════════════════════════════════════════════

    - name: 🛡️ Clone & Apply SUSFS patches
      run: |
        echo "════════════════════════════════════════"
        echo "  SUSFS Integration"
        echo "  (Wajib untuk SukiSU Ultra)"
        echo "════════════════════════════════════════"

        # Clone SUSFS patcher yang kompatibel dengan SukiSU Ultra
        if ! git clone --depth=1 \
          https://github.com/sidex15/susfs4ksu susfs4ksu; then
          echo "⚠️  susfs4ksu clone gagal — coba mirror..."
          git clone --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu susfs4ksu || {
            echo "❌ Semua SUSFS source gagal di-clone!"
            exit 1
          }
        fi

        echo ""
        echo "▶ SUSFS repo structure:"
        ls -la susfs4ksu/

        # Deteksi versi kernel untuk memilih patch yang tepat
        cd kernel
        KERNEL_VER=$(head -1 Makefile | grep -o 'VERSION = [0-9]*' | awk '{print $3}')
        PATCHLEVEL=$(head -3 Makefile | grep 'PATCHLEVEL' | awk '{print $3}')
        FULL_VER="${KERNEL_VER}.${PATCHLEVEL}"
        echo ""
        echo "▶ Kernel version detected: ${FULL_VER}"
        cd ..

        # Cari patch file yang sesuai versi kernel
        SUSFS_PATCH=""
        for pf in \
          "susfs4ksu/kernel_patches/50_add_susfs_in_${FULL_VER}.patch" \
          "susfs4ksu/kernel_patches/add_susfs_in_${FULL_VER}.patch" \
          "susfs4ksu/kernel_patches/50_add_susfs_in_gki.patch" \
          "susfs4ksu/kernel_patches/add_susfs_in_gki.patch"; do
          if [ -f "$pf" ]; then
            SUSFS_PATCH="$pf"
            echo "  ✅ Found SUSFS patch: ${pf}"
            break
          fi
        done

        # List semua patch tersedia untuk debugging
        echo ""
        echo "▶ Available SUSFS patches:"
        find susfs4ksu -name '*.patch' | sort | head -20

        if [ -n "$SUSFS_PATCH" ]; then
          echo ""
          echo "▶ Applying SUSFS kernel patch: ${SUSFS_PATCH}"
          cd kernel
          if patch -p1 --dry-run < "../${SUSFS_PATCH}" 2>&1; then
            patch -p1 < "../${SUSFS_PATCH}"
            echo "  ✅ SUSFS patch applied successfully"
          else
            echo "  ⚠️  Patch dry-run failed — mencoba dengan fuzz..."
            patch -p1 --fuzz=3 < "../${SUSFS_PATCH}" || {
              echo "  ⚠️  Patch gagal — SUSFS akan di-skip (non-fatal)"
              echo "  ℹ️  SukiSU Ultra tetap berfungsi tanpa SUSFS"
              echo "  ℹ️  Untuk SUSFS penuh, patch kernel secara manual"
            }
          fi
          cd ..
        else
          echo ""
          echo "  ⚠️  Tidak ada SUSFS patch cocok untuk kernel ${FULL_VER}"
          echo "  ℹ️  SUSFS di-skip — SukiSU Ultra tetap berfungsi"
          echo "  ℹ️  Check susfs4ksu repo untuk patch kernel versi ini"
        fi

        # Copy SUSFS driver jika ada
        SUSFS_DRIVER_SRC=""
        for sd in \
          "susfs4ksu/kernel_patches/fs/susfs.c" \
          "susfs4ksu/fs/susfs.c"; do
          if [ -f "$sd" ]; then
            SUSFS_DRIVER_SRC="$sd"
            break
          fi
        done

        if [ -n "$SUSFS_DRIVER_SRC" ]; then
          echo ""
          echo "▶ Integrating SUSFS fs driver..."
          mkdir -p kernel/fs/susfs
          cp "$SUSFS_DRIVER_SRC" kernel/fs/susfs/susfs.c
          # Copy header jika ada
          for sh in \
            "susfs4ksu/kernel_patches/include/linux/susfs.h" \
            "susfs4ksu/include/linux/susfs.h"; do
            if [ -f "$sh" ]; then
              cp "$sh" kernel/include/linux/susfs.h
              echo "  ✅ susfs.h copied"
              break
            fi
          done
          echo "  ✅ SUSFS driver integrated"
        fi

        echo ""
        echo "✅ SUSFS integration step complete"

    # ══════════════════════════════════════════════════════════
    # STEP 6: Apply SukiSU Ultra Kernel Hooks
    # ══════════════════════════════════════════════════════════

    - name: 🔧 Apply SukiSU Ultra kernel hooks
      run: |
        SCRIPT="$GITHUB_WORKSPACE/scripts/apply_hooks.py"
        KERNEL_DIR="$GITHUB_WORKSPACE/kernel"

        if [ ! -f "$SCRIPT" ]; then
          echo "❌ apply_hooks.py tidak ditemukan: $SCRIPT"
          exit 1
        fi

        echo "▶ Running apply_hooks.py (SukiSU Ultra hooks)..."
        if ! python3 "$SCRIPT" "$KERNEL_DIR" 2>&1 | tee patch.log; then
          echo "❌ PATCH SCRIPT GAGAL"
          cat patch.log
          exit 1
        fi

        echo ""
        echo "▶ Validating SukiSU Ultra hook injection..."
        # SukiSU Ultra hook markers — sesuaikan dengan API di include/ksu.h
        CRITICAL_FILES=(
          "fs/exec.c:ksu_handle_execveat_sucompat"
          "fs/open.c:ksu_handle_faccessat"
          "drivers/input/input.c:ksu_handle_input_handle_event"
        )
        FAILED=0
        for entry in "${CRITICAL_FILES[@]}"; do
          FILE="${entry%%:*}"
          MARKER="${entry##*:}"
          if grep -q "$MARKER" "$KERNEL_DIR/$FILE" 2>/dev/null; then
            echo "  ✅ ${FILE} → ${MARKER}"
          else
            # Fallback: cek apakah ada marker alternatif SukiSU Ultra
            ALT_MARKER="ksu_handle_$(echo $MARKER | sed 's/ksu_handle_//')"
            if grep -qE 'ksu_handle_|ksu_execveat|susfs_' \
               "$KERNEL_DIR/$FILE" 2>/dev/null; then
              echo "  ⚠️  ${FILE} → marker berbeda (OK, SukiSU Ultra compat)"
            else
              echo "  ❌ ${FILE} tidak memiliki hook SukiSU Ultra"
              FAILED=1
            fi
          fi
        done
        [ $FAILED -eq 1 ] && {
          echo "❌ Hook kritis gagal!"
          exit 1
        }
        echo "✅ Semua hook SukiSU Ultra berhasil"

    # ══════════════════════════════════════════════════════════
    # STEP 7: Configure Kernel
    # ══════════════════════════════════════════════════════════

    - name: 🏗️ Configure kernel
      run: |
        cd kernel

        echo "════════════════════════════════════════"
        echo "  [1/3] Base defconfig"
        echo "════════════════════════════════════════"
        make O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          vendor/kona-perf_defconfig

        echo ""
        echo "════════════════════════════════════════"
        echo "  [2/3] Merge device-specific config"
        echo "════════════════════════════════════════"
        TIMELM_CFG=""
        for cfg_path in \
          "arch/arm64/configs/vendor/timelm.config" \
          "arch/arm64/configs/timelm.config"; do
          if [ -f "$cfg_path" ]; then
            TIMELM_CFG="$cfg_path"
            break
          fi
        done

        if [ -n "$TIMELM_CFG" ]; then
          echo "  Using: $TIMELM_CFG"
          ./scripts/kconfig/merge_config.sh -O out out/.config "$TIMELM_CFG"
          MERGE_EXIT=$?
          [ $MERGE_EXIT -ne 0 ] && \
            echo "⚠️  merge_config.sh exit ${MERGE_EXIT} (non-fatal)"
        else
          echo "  ⚠️  timelm.config tidak ditemukan, skip"
        fi

        echo ""
        echo "════════════════════════════════════════"
        echo "  [3/3] Enable SukiSU Ultra + SUSFS configs"
        echo "════════════════════════════════════════"

        # Core kernel configs
        ./scripts/config --file out/.config \
          --enable CONFIG_KPROBES \
          --enable CONFIG_HAVE_KPROBES \
          --enable CONFIG_KPROBE_EVENTS \
          --enable CONFIG_EXT4_FS \
          --enable CONFIG_MODULES \
          --enable CONFIG_MODULE_UNLOAD \
          --enable CONFIG_OVERLAY_FS

        # SukiSU Ultra core config
        ./scripts/config --file out/.config --enable CONFIG_KSU

        # SUSFS configs — enable jika tersedia di Kconfig
        for susfs_cfg in \
          CONFIG_KSU_SUSFS \
          CONFIG_KSU_SUSFS_SUS_PATH \
          CONFIG_KSU_SUSFS_SUS_MOUNT \
          CONFIG_KSU_SUSFS_SUS_KSTAT \
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
          CONFIG_KSU_SUSFS_SPOOF_UNAME; do
          if grep -qr "${susfs_cfg#CONFIG_}" \
             drivers/kernelsu/Kconfig 2>/dev/null; then
            ./scripts/config --file out/.config --enable "$susfs_cfg"
            echo "  ✅ Enabled ${susfs_cfg}"
          else
            echo "  ℹ️  ${susfs_cfg} tidak ada di Kconfig — skip"
          fi
        done

        # Auto-detect manual hook config name
        MANUAL_HOOK_CFG=$(grep -oE \
          'config KSU_MANUAL_HOOK[A-Z_]*' \
          drivers/kernelsu/Kconfig 2>/dev/null \
          | head -1 | awk '{print $2}')
        if [ -n "$MANUAL_HOOK_CFG" ]; then
          ./scripts/config --file out/.config \
            --enable "CONFIG_${MANUAL_HOOK_CFG}"
          echo "  ✅ Enabled CONFIG_${MANUAL_HOOK_CFG}"
        fi

        make O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          olddefconfig

        echo ""
        echo "▶ Verifying SukiSU Ultra + SUSFS configs..."
        KSU_VAL=$(grep -E '^CONFIG_KSU=' out/.config | cut -d= -f2)
        if [ "$KSU_VAL" = "y" ] || [ "$KSU_VAL" = "m" ]; then
          echo "  ✅ CONFIG_KSU=${KSU_VAL}"
        else
          echo "  ❌ CONFIG_KSU tidak aktif! Nilai: '${KSU_VAL}'"
          grep '^CONFIG_KPROBES='  out/.config || echo "    KPROBES not set"
          grep '^CONFIG_EXT4_FS='  out/.config || echo "    EXT4_FS not set"
          grep '^CONFIG_MODULES='  out/.config || echo "    MODULES not set"
          grep -A 8 '^config KSU$' drivers/kernelsu/Kconfig \
            || echo "    KSU Kconfig tidak ditemukan"
          exit 1
        fi

        echo "  CONFIG_MODULES    : $(grep '^CONFIG_MODULES='    out/.config | cut -d= -f2 || echo 'not set')"
        echo "  CONFIG_KPROBES    : $(grep '^CONFIG_KPROBES='    out/.config | cut -d= -f2 || echo 'not set')"
        echo "  CONFIG_OVERLAY_FS : $(grep '^CONFIG_OVERLAY_FS=' out/.config | cut -d= -f2 || echo 'not set')"
        echo "  CONFIG_KSU_SUSFS  : $(grep '^CONFIG_KSU_SUSFS='  out/.config | cut -d= -f2 || echo 'not set / not available')"

    # ══════════════════════════════════════════════════════════
    # STEP 8: Pre-build SukiSU Ultra Isolation Test
    # ══════════════════════════════════════════════════════════

    - name: 🧪 Pre-build SukiSU Ultra isolation test
      run: |
        cd kernel

        echo "════════════════════════════════════════"
        echo "  SukiSU Ultra Isolation Test — V=1"
        echo "════════════════════════════════════════"

        set -o pipefail
        make O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          V=1 \
          -j$(nproc) \
          drivers/kernelsu/ 2>&1 | tee ksu_build_test.log

        KSU_TEST_EXIT=${PIPESTATUS[0]}

        echo ""
        echo "▶ Build log summary:"
        echo "────────────────────────────────────────"
        grep -E 'warning:|error:|fatal error:|undefined|cannot find|No such' \
          ksu_build_test.log | head -40 || echo "  (tidak ada warning/error)"
        echo "────────────────────────────────────────"

        if [ $KSU_TEST_EXIT -ne 0 ]; then
          echo ""
          echo "❌ SUKISU ULTRA MODULE BUILD FAILED"
          echo ""
          echo "▶ LAST 100 LINES:"
          tail -100 ksu_build_test.log
          echo ""
          echo "▶ ALL ERROR LINES:"
          grep -n -E \
            'error:|fatal error:|undefined reference|cannot find|No such file' \
            ksu_build_test.log || echo "  (tidak ada pattern error standar)"
          echo ""
          echo "▶ Kbuild debug info:"
          cat drivers/kernelsu/Kbuild
          exit 1
        fi

        echo "✅ SukiSU Ultra isolation test PASSED — lanjut full build"

    # ══════════════════════════════════════════════════════════
    # STEP 9: Compile Kernel (Full)
    # ══════════════════════════════════════════════════════════

    - name: 🔨 Compile kernel
      run: |
        cd kernel

        BUILD_START=$(date +%s)
        echo "════════════════════════════════════════"
        echo "  Starting full kernel build"
        echo "════════════════════════════════════════"
        echo "Compiler : $(clang --version | head -1)"
        echo "Cores    : $(nproc)"
        echo "Disk free: $(df -h / | tail -1 | awk '{print $4}')"
        echo "Time     : $(date '+%Y-%m-%d %H:%M:%S')"

        set -o pipefail
        timeout 90m make O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          -j$(nproc) \
          2>&1 | tee build.log

        BUILD_EXIT=${PIPESTATUS[0]}
        BUILD_TIME=$(( $(date +%s) - BUILD_START ))

        echo ""
        echo "════════════════════════════════════════"
        echo "Exit code: $BUILD_EXIT"
        echo "Duration : $(printf '%02d:%02d:%02d' \
          $((BUILD_TIME/3600)) \
          $((BUILD_TIME%3600/60)) \
          $((BUILD_TIME%60)))"
        echo "Disk free: $(df -h / | tail -1 | awk '{print $4}')"

        if [ "$BUILD_EXIT" -ne 0 ]; then
          echo "❌ COMPILATION FAILED"
          AVAIL_MB=$(( $(df / | tail -1 | awk '{print $4}') / 1024 ))
          [ "$AVAIL_MB" -lt 500 ] && echo "🚨 DISK KRITIS: ${AVAIL_MB}MB"

          if [ -f build.log ] && [ -s build.log ]; then
            echo ""
            echo "▶ [A] LAST 100 LINES:"
            tail -100 build.log
            echo ""
            echo "▶ [B] FIRST ERROR + context:"
            ERRLINE=$(grep -n \
              -E '^[^:]+\.(c|h|S):[0-9]+:[0-9]+: error:|make\[[0-9]+\]: \*\*\*|No space left|ld\.lld: error:|undefined reference' \
              build.log | head -1 | cut -d: -f1)
            if [ -n "$ERRLINE" ]; then
              START=$(( ERRLINE > 20 ? ERRLINE - 20 : 1 ))
              sed -n "${START},$(( ERRLINE + 50 ))p" build.log
            fi
            echo ""
            echo "▶ [C] ALL ERRORS:"
            grep -n -E 'error:|undefined reference|No space left' \
              build.log | head -60 || echo "  (tidak ada)"
          else
            echo "❌ build.log tidak ada / kosong"
          fi
          exit 1
        fi

        echo "▶ Build artifacts:"
        FOUND=0
        for img in Image.gz-dtb Image.gz Image; do
          if [ -f "out/arch/arm64/boot/$img" ]; then
            echo "  ✅ $img ($(du -h out/arch/arm64/boot/$img | cut -f1))"
            FOUND=1
          fi
        done
        [ "$FOUND" -eq 0 ] && {
          echo "❌ Tidak ada kernel image!"
          exit 1
        }
        echo "✅ BUILD SUCCESS — SukiSU Ultra + SUSFS"

    # ══════════════════════════════════════════════════════════
    # STEP 10: Create Flashable ZIP
    # ══════════════════════════════════════════════════════════

    - name: 📦 Create AnyKernel3 flashable ZIP
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
        cd AnyKernel3

        sed -i 's|do\.devicecheck=.*|do.devicecheck=1|'                   anykernel.sh
        sed -i 's|device\.name1=.*|device.name1=timelm|'                  anykernel.sh
        sed -i 's|device\.name2=.*|device.name2=lge_v60|'                 anykernel.sh
        sed -i 's|device\.name3=.*|device.name3=LM-V600|'                 anykernel.sh
        sed -i 's|device\.name4=.*|device.name4=LM-V600N|'                anykernel.sh
        sed -i 's|device\.name5=.*|device.name5=|'                        anykernel.sh
        sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|'    anykernel.sh
        sed -i 's|is_slot_device=.*|is_slot_device=1;|'                   anykernel.sh

        BRANCH="${{ github.event.inputs.kernel_branch }}"
        sed -i "s|kernel\.string=.*|kernel.string=SukiSU Ultra + SUSFS LG V60 (${BRANCH})|" \
          anykernel.sh

        BOOT="../kernel/out/arch/arm64/boot"
        COPIED=0
        for img in Image.gz-dtb Image.gz Image; do
          if [ -f "$BOOT/$img" ]; then
            cp "$BOOT/$img" ./
            echo "✅ $img ($(du -h $img | cut -f1))"
            COPIED=1
            break
          fi
        done
        [ "$COPIED" -eq 0 ] && {
          echo "❌ No kernel image found!"
          exit 1
        }

        mkdir -p dtbs
        if [ -d "$BOOT/dts" ]; then
          DTB_COUNT=$(find "$BOOT/dts" -name "*.dtb" | wc -l)
          if [ "$DTB_COUNT" -gt 0 ]; then
            find "$BOOT/dts" -name "*.dtb" -exec cp {} dtbs/ \;
            echo "✅ ${DTB_COUNT} DTB files copied"
          fi
        fi

        BUILD_DATE=$(date +%Y%m%d-%H%M)
        ZIP_NAME="SukiSU-Ultra-SUSFS-V60-${BRANCH}-${BUILD_DATE}.zip"
        zip -r9 "../${ZIP_NAME}" . \
          -x ".git/*" -x "README.md" -x "*.placeholder" -x ".gitignore"
        cd ..
        echo "✅ ZIP: ${ZIP_NAME} ($(du -h ${ZIP_NAME} | cut -f1))"

    # ══════════════════════════════════════════════════════════
    # STEP 11: Upload Artifacts
    # ══════════════════════════════════════════════════════════

    - name: ⬆️ Upload kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: SukiSU-Ultra-SUSFS-V60-${{ github.event.inputs.kernel_branch }}
        path: SukiSU-Ultra-SUSFS-V60-*.zip
        retention-days: 7
        compression-level: 0

    - name: ⬆️ Upload build logs & config
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ github.event.inputs.kernel_branch }}
        path: |
          kernel/build.log
          kernel/ksu_build_test.log
          kernel/drivers/kernelsu/Kbuild
          patch.log
          kernel/out/.config
        retention-days: 7

    # ══════════════════════════════════════════════════════════
    # STEP 12: Build Summary
    # ══════════════════════════════════════════════════════════

    - name: 📊 Build summary
      if: always()
      run: |
        echo "═══════════════════════════════════════════════════════"
        echo "      BUILD SUMMARY — SukiSU Ultra + SUSFS v6"
        echo "═══════════════════════════════════════════════════════"

        if ls SukiSU-Ultra-SUSFS-V60-*.zip 1>/dev/null 2>&1; then
          echo "✅ Status: SUCCESS"
          ls -lh SukiSU-Ultra-SUSFS-V60-*.zip
          echo ""
          echo "📥 Download: Actions → Summary → Artifacts"
          echo "📱 Flash via TWRP/OrangeFox"
          echo "⚠️  Backup boot.img sebelum flash!"
          echo "⚠️  Gunakan SukiSU Ultra Manager App"
          echo "⚠️  BUKAN KernelSU Manager — akan error!"
        else
          echo "❌ Status: FAILED"
          echo ""
          echo "📋 Troubleshooting v6:"
          echo "  1. Cek Step 'Generate Kbuild' — lihat isi Kbuild yang digenerate"
          echo "  2. Cek Step 'SukiSU Ultra isolation test' — lihat error spesifik"
          echo "  3. Download artifact 'build-logs' — cek Kbuild + build.log"
          echo "  4. Verifikasi struktur repo SukiSU Ultra tidak berubah"
        fi

        echo ""
        echo "════════ v6 Fix Summary ════════"
        echo "RC-1: grep -v 'policy' dihapus total"
        echo "      → Tidak lagi memfilter feature.h yang ada di policy/"
        echo "RC-2: Kbuild di-generate secara programatik"
        echo "      → Berdasarkan .c files aktual, bukan asumsi struktur"
        echo "RC-3: Standalone Makefile tidak di-inject"
        echo "      → Kbuild baru yang digunakan kernel build system"
        echo "NEW:  SUSFS integration (sus_path, sus_mount, sus_kstat)"
        echo "NEW:  Multi-path ccflags (policy/, include/, infra/, dll)"
        echo "════════════════════════════════"
        echo ""
        echo "Branch  : ${{ github.event.inputs.kernel_branch }}"
        echo "Time    : $(date '+%Y-%m-%d %H:%M:%S %Z')"
        echo "Run URL : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo "═══════════════════════════════════════════════════════"
