name: 🔨 Build LG V60 Kernel + SukiSU Ultra

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Branch kernel LineageOS'
        required: true
        default: 'lineage-22.2'
        type: choice
        options:
          - lineage-23.2
          - lineage-23.0
          - lineage-22.2

env:
  ARCH: arm64
  SUBARCH: arm64
  CC: clang
  LD: ld.lld
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

    # ══════════════════════════════════════════════════════════
    # STEP 1: Setup Environment
    # ══════════════════════════════════════════════════════════

    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🗑️ Free up disk space
      run: |
        echo "Disk sebelum cleanup:"
        df -h / | tail -1
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /usr/local/.ghcup \
          /usr/share/swift \
          /opt/hostedtoolcache/CodeQL \
          /usr/local/share/boost
        sudo apt-get clean
        sudo apt-get autoremove -y
        echo "Disk setelah cleanup:"
        df -h / | tail -1

    - name: 📦 Install build dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          git bc bison flex libssl-dev libelf-dev \
          libncurses5-dev python3 python-is-python3 \
          zip unzip wget curl cpio kmod \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

    - name: ⚙️ Install Clang 17
      run: |
        wget -q https://apt.llvm.org/llvm.sh -O llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 17 all
        for tool in clang clang++ ld.lld llvm-ar llvm-nm \
                    llvm-objcopy llvm-objdump llvm-readelf \
                    llvm-strip llvm-ranlib; do
          if [ -f "/usr/bin/${tool}-17" ]; then
            sudo ln -sf "/usr/bin/${tool}-17" "/usr/local/bin/${tool}"
          fi
        done
        echo "Clang version:"; clang --version | head -3
        echo "LLD version:";   ld.lld --version

    # ══════════════════════════════════════════════════════════
    # STEP 2: Clone Kernel Source
    # ══════════════════════════════════════════════════════════

    - name: 📥 Clone kernel source
      run: |
        git clone --depth=1 \
          https://github.com/LineageOS/android_kernel_lge_sm8250 \
          -b ${{ github.event.inputs.kernel_branch }} kernel
        cd kernel
        echo "Kernel version:"
        head -3 Makefile | grep -E 'VERSION|PATCHLEVEL|SUBLEVEL' | \
          awk '{print $3}' | tr '\n' '.' | sed 's/\.$//'
        echo ""

    # ══════════════════════════════════════════════════════════
    # STEP 3: Clone SukiSU Ultra
    # ══════════════════════════════════════════════════════════

    - name: 💉 Clone SukiSU Ultra source
      run: |
        cd kernel

        echo "▶ Cloning SukiSU Ultra repository..."
        if ! git clone --depth=1 \
          https://github.com/SukiSU-Ultra/SukiSU-Ultra SukiSU; then
          echo "❌ Gagal clone SukiSU Ultra repository!"
          exit 1
        fi

        echo ""
        echo "▶ Validating SukiSU repo structure..."
        echo "   SukiSU root contents:"
        ls -la SukiSU/

        # Auto-detect direktori kernel SukiSU
        SUKISU_KERNEL_DIR=""
        for candidate in "SukiSU/kernel" "SukiSU" "SukiSU/KernelSU/kernel"; do
          if [ -f "${candidate}/Kconfig" ] && [ -f "${candidate}/Makefile" ]; then
            SUKISU_KERNEL_DIR="${candidate}"
            echo "   ✅ Found SukiSU kernel dir: ${candidate}"
            break
          fi
        done

        if [ -z "$SUKISU_KERNEL_DIR" ]; then
          echo "❌ Tidak dapat menemukan Kconfig + Makefile di repo SukiSU!"
          find SukiSU -name 'Kconfig' -o -name 'Makefile' | head -20
          ls -la SukiSU/
          [ -d "SukiSU/kernel" ] && ls -la SukiSU/kernel/
          exit 1
        fi

        echo "   .c files:"
        ls "${SUKISU_KERNEL_DIR}"/*.c 2>/dev/null | head -5 \
          || find "${SUKISU_KERNEL_DIR}" -name '*.c' | head -5

        echo ""
        echo "▶ Copying SukiSU → drivers/kernelsu/ (hardcopy)..."
        cp -r "${SUKISU_KERNEL_DIR}" drivers/kernelsu

        if [ ! -d drivers/kernelsu ] || \
           [ ! -f drivers/kernelsu/Kconfig ] || \
           [ ! -f drivers/kernelsu/Makefile ]; then
          echo "❌ Hardcopy gagal atau struktur tidak lengkap!"
          ls -la drivers/kernelsu/ 2>/dev/null || echo "  direktori tidak ada"
          exit 1
        fi

        echo "✅ drivers/kernelsu/ ready"
        ls -la drivers/kernelsu/ | head -20

    # ══════════════════════════════════════════════════════════
    # STEP 4: Integrate SukiSU into Build System
    #
    # ROOT CAUSE FIX (v5):
    #   Bug lama: grep -qF "$(srctree)/..." menggunakan double-quote
    #   sehingga shell EXPAND $(srctree) sebagai subshell → string
    #   kosong → kondisi check selalu FALSE → inject rusak.
    #
    #   Fix: gunakan single-quote untuk literal string comparison,
    #   sederhanakan logic, tambah mandatory verification.
    # ══════════════════════════════════════════════════════════

    - name: 🔧 Integrate SukiSU into build system
      run: |
        cd kernel

        KERNELSU_MK="drivers/kernelsu/Makefile"

        # ─────────────────────────────────────────────────────────
        # FIX UTAMA v5: Inject ccflags-y dengan benar
        #
        # ROOT CAUSE error sebelumnya:
        #   grep -qF "$(srctree)/drivers/kernelsu" "$KERNELSU_MK"
        #   ↑ Double-quote menyebabkan shell expand $(srctree)
        #   sebagai subshell command. Hasilnya string kosong,
        #   sehingga kondisi check SELALU false → inject duplikat
        #   atau tidak jalan sama sekali.
        #
        # FIX: gunakan single-quote untuk grep literal string check
        #      sehingga '$(srctree)' diperlakukan sebagai plain text.
        # ─────────────────────────────────────────────────────────
        echo "▶ [FIX v5] Patching ccflags-y di ${KERNELSU_MK}..."
        echo ""
        echo "  Makefile SukiSU SEBELUM patch:"
        cat "$KERNELSU_MK"
        echo "  ─────────────────────────────"
        echo ""

        # PENTING: single-quote di grep agar $(srctree) tidak di-expand shell
        if ! grep -qF '$(srctree)/drivers/kernelsu' "$KERNELSU_MK"; then
          # Inject di baris pertama — backslash-escape $ agar tidak di-expand
          sed -i '1s|^|ccflags-y += -I$(srctree)/drivers/kernelsu\n|' "$KERNELSU_MK"
          echo "  ✅ ccflags-y berhasil di-inject di baris 1"
        else
          echo "  ✅ ccflags-y sudah ada dan benar — skip inject"
        fi

        echo ""
        echo "  Makefile SukiSU SETELAH patch:"
        head -10 "$KERNELSU_MK"
        echo "  ─────────────────────────────"

        # Mandatory verification — gagalkan build jika inject tidak berhasil
        echo ""
        echo "▶ Mandatory verification ccflags-y..."
        if grep -qF '$(srctree)/drivers/kernelsu' "$KERNELSU_MK"; then
          echo "  ✅ VERIFY OK: ccflags-y ada di Makefile"
        else
          echo "  ❌ VERIFY FAILED: ccflags-y TIDAK DITEMUKAN di Makefile!"
          echo "     Isi Makefile saat ini:"
          cat "$KERNELSU_MK"
          exit 1
        fi

        # ─────────────────────────────────────────────────────────
        # Verifikasi struktur uapi/ — critical header directory
        # ─────────────────────────────────────────────────────────
        echo ""
        echo "▶ Verifying uapi/ header directory..."
        if [ -d "drivers/kernelsu/uapi" ]; then
          echo "  ✅ drivers/kernelsu/uapi/ EXISTS"
          ls -la drivers/kernelsu/uapi/
          for hdr in "feature.h" "app_profile.h"; do
            if [ -f "drivers/kernelsu/uapi/${hdr}" ]; then
              echo "  ✅ uapi/${hdr} → OK"
            else
              echo "  ⚠️  uapi/${hdr} → NOT FOUND"
              echo "     Mencari di seluruh kernelsu/..."
              find drivers/kernelsu -name "${hdr}" | head -5
            fi
          done
        else
          echo "  ⚠️  drivers/kernelsu/uapi/ TIDAK ADA!"
          echo "     Mencari header kritis secara rekursif..."
          find drivers/kernelsu -name 'feature.h' -o \
                                -name 'app_profile.h' | head -10

          # FALLBACK: Jika uapi/ tidak ada tapi header ada di lokasi lain,
          # buat symlink uapi/ agar resolusi path tetap bekerja.
          FEAT_H=$(find drivers/kernelsu -name 'feature.h' | \
                   grep -v 'policy' | head -1)
          if [ -n "$FEAT_H" ]; then
            UAPI_ACTUAL_DIR=$(dirname "$FEAT_H")
            echo "  🔧 Fallback: membuat symlink uapi/ → ${UAPI_ACTUAL_DIR}"
            ln -sfn "$(realpath "$UAPI_ACTUAL_DIR")" \
                    drivers/kernelsu/uapi
            echo "  ✅ Symlink dibuat: drivers/kernelsu/uapi → ${UAPI_ACTUAL_DIR}"
          else
            echo "  ❌ feature.h tidak ditemukan sama sekali di repo SukiSU!"
            echo "     Struktur repo:"
            find drivers/kernelsu -name '*.h' | head -30
            exit 1
          fi
        fi

        # ─────────────────────────────────────────────────────────
        # FIX #1: obj-$(CONFIG_KSU) bukan obj-y
        # ─────────────────────────────────────────────────────────
        echo ""
        echo "▶ [FIX #1] Patching drivers/Makefile..."
        if ! grep -q 'kernelsu' drivers/Makefile; then
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          echo "  ✅ Added: obj-\$(CONFIG_KSU) += kernelsu/"
        else
          if grep -q 'obj-y += kernelsu/' drivers/Makefile; then
            sed -i 's|obj-y += kernelsu/|obj-$(CONFIG_KSU) += kernelsu/|g' \
              drivers/Makefile
            echo "  ✅ Fixed: obj-y → obj-\$(CONFIG_KSU)"
          else
            echo "  ⏭️  kernelsu entry sudah benar di drivers/Makefile"
            grep 'kernelsu' drivers/Makefile
          fi
        fi

        echo ""
        echo "▶ Patching drivers/Kconfig..."
        if ! grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
          if grep -q '^endmenu' drivers/Kconfig; then
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
            echo "  ✅ Added kernelsu to Kconfig (before endmenu)"
          else
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
            echo "  ✅ Added kernelsu to Kconfig (appended)"
          fi
        else
          echo "  ⏭️  kernelsu sudah ada di Kconfig"
        fi

        # ─────────────────────────────────────────────────────────
        # Summary integrasi
        # ─────────────────────────────────────────────────────────
        echo ""
        echo "════════ Integration Summary ════════"
        echo "drivers/Makefile:"
        grep 'kernelsu' drivers/Makefile || echo "  (tidak ada entry)"
        echo "drivers/Kconfig:"
        grep 'kernelsu' drivers/Kconfig  || echo "  (tidak ada entry)"
        echo "drivers/kernelsu/Makefile (5 baris pertama):"
        head -5 drivers/kernelsu/Makefile
        echo "config KSU in Kconfig:"
        grep -A 6 '^config KSU$' drivers/kernelsu/Kconfig \
          || echo "  (tidak ditemukan)"
        echo "═════════════════════════════════════"

    # ══════════════════════════════════════════════════════════
    # STEP 5: Apply Manual Hooks
    # ══════════════════════════════════════════════════════════

    - name: 🔧 Apply kernel hooks
      run: |
        SCRIPT="$GITHUB_WORKSPACE/scripts/apply_hooks.py"
        KERNEL_DIR="$GITHUB_WORKSPACE/kernel"

        if [ ! -f "$SCRIPT" ]; then
          echo "❌ apply_hooks.py tidak ditemukan: $SCRIPT"
          exit 1
        fi

        echo "▶ Running apply_hooks.py..."
        if ! python3 "$SCRIPT" "$KERNEL_DIR" 2>&1 | tee patch.log; then
          echo "❌ PATCH SCRIPT GAGAL"; cat patch.log; exit 1
        fi

        echo ""
        echo "▶ Validating critical patches..."
        CRITICAL_FILES=(
          "fs/exec.c:ksu_execveat_hook"
          "fs/open.c:ksu_handle_faccessat"
          "drivers/input/input.c:ksu_input_hook"
        )
        FAILED=0
        for entry in "${CRITICAL_FILES[@]}"; do
          FILE="${entry%%:*}"; MARKER="${entry##*:}"
          if grep -q "$MARKER" "$KERNEL_DIR/$FILE" 2>/dev/null; then
            echo "  ✅ $FILE ($MARKER)"
          else
            echo "  ❌ $FILE tidak memiliki $MARKER"; FAILED=1
          fi
        done
        [ $FAILED -eq 1 ] && { echo "❌ Patch kritis gagal!"; exit 1; }
        echo "✅ Semua patch kritis berhasil"

    # ══════════════════════════════════════════════════════════
    # STEP 6: Configure Kernel
    # ══════════════════════════════════════════════════════════

    - name: 🏗️ Configure kernel
      run: |
        cd kernel

        echo "════════════════════════════════════════"
        echo "  [1/3] Base defconfig"
        echo "════════════════════════════════════════"
        make O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          vendor/kona-perf_defconfig

        echo ""
        echo "════════════════════════════════════════"
        echo "  [2/3] Merge device-specific config"
        echo "════════════════════════════════════════"
        TIMELM_CFG=""
        for cfg_path in \
          "arch/arm64/configs/vendor/timelm.config" \
          "arch/arm64/configs/timelm.config"; do
          if [ -f "$cfg_path" ]; then TIMELM_CFG="$cfg_path"; break; fi
        done

        if [ -n "$TIMELM_CFG" ]; then
          echo "  Using: $TIMELM_CFG"
          ./scripts/kconfig/merge_config.sh -O out out/.config "$TIMELM_CFG"
          MERGE_EXIT=$?
          [ $MERGE_EXIT -ne 0 ] && \
            echo "⚠️  merge_config.sh exit $MERGE_EXIT (non-fatal)"
        else
          echo "  ⚠️  timelm.config tidak ditemukan, skip"
        fi

        echo ""
        echo "════════════════════════════════════════"
        echo "  [3/3] Enable SukiSU Ultra configs"
        echo "════════════════════════════════════════"
        ./scripts/config --file out/.config \
          --enable CONFIG_KPROBES \
          --enable CONFIG_HAVE_KPROBES \
          --enable CONFIG_KPROBE_EVENTS \
          --enable CONFIG_EXT4_FS \
          --enable CONFIG_MODULES \
          --enable CONFIG_MODULE_UNLOAD \
          --enable CONFIG_OVERLAY_FS \
          --enable CONFIG_KSU

        MANUAL_HOOK_CFG=$(grep -o 'config KSU_MANUAL_HOOK\|config KSU_MANUAL\b' \
          drivers/kernelsu/Kconfig 2>/dev/null | head -1 | awk '{print $2}')
        if [ -n "$MANUAL_HOOK_CFG" ]; then
          echo "  Enabling CONFIG_${MANUAL_HOOK_CFG}..."
          ./scripts/config --file out/.config \
            --enable "CONFIG_${MANUAL_HOOK_CFG}"
        fi

        make O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          olddefconfig

        echo ""
        echo "▶ Verifying SukiSU configs..."
        KSU_VAL=$(grep -E '^CONFIG_KSU=' out/.config | cut -d= -f2)
        if [ "$KSU_VAL" = "y" ] || [ "$KSU_VAL" = "m" ]; then
          echo "  ✅ CONFIG_KSU=${KSU_VAL}"
        else
          echo "  ❌ CONFIG_KSU tidak aktif! Nilai: '${KSU_VAL}'"
          grep '^CONFIG_KPROBES=' out/.config  || echo "    CONFIG_KPROBES not set"
          grep '^CONFIG_EXT4_FS=' out/.config  || echo "    CONFIG_EXT4_FS not set"
          grep '^CONFIG_MODULES='  out/.config || echo "    CONFIG_MODULES not set"
          grep -A8 'config KSU' drivers/kernelsu/Kconfig \
            || echo "    KSU Kconfig tidak ditemukan"
          exit 1
        fi
        grep '^CONFIG_MODULES='    out/.config || echo "  CONFIG_MODULES not set"
        grep '^CONFIG_KPROBES='    out/.config || echo "  CONFIG_KPROBES not set"
        grep '^CONFIG_OVERLAY_FS=' out/.config || echo "  CONFIG_OVERLAY_FS not set"

    # ══════════════════════════════════════════════════════════
    # STEP 7: Pre-build KSU Isolation Test
    # ══════════════════════════════════════════════════════════

    - name: 🧪 Pre-build KSU module isolation test
      run: |
        cd kernel

        echo "════════════════════════════════════════"
        echo "  KSU Isolation Test — V=1 verbose"
        echo "════════════════════════════════════════"

        set -o pipefail
        make O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          V=1 \
          -j$(nproc) \
          drivers/kernelsu/ 2>&1 | tee ksu_build_test.log

        KSU_TEST_EXIT=${PIPESTATUS[0]}

        echo ""
        echo "▶ Build log summary:"
        echo "────────────────────────────────────────"
        grep -E 'warning:|error:|fatal error:|undefined|cannot find|No such' \
          ksu_build_test.log | head -30 || echo "  (tidak ada warning/error)"
        echo "────────────────────────────────────────"

        if [ $KSU_TEST_EXIT -ne 0 ]; then
          echo ""
          echo "❌ KSU MODULE BUILD FAILED:"
          echo ""
          echo "▶ LAST 80 LINES:"
          echo "════════════════════════════════════════"
          tail -80 ksu_build_test.log
          echo "════════════════════════════════════════"
          echo ""
          echo "▶ ALL ERROR LINES:"
          grep -n -E 'error:|fatal error:|undefined reference|cannot find|No such file' \
            ksu_build_test.log || echo "  (tidak ada pattern error standar)"
          exit 1
        fi

        echo "✅ KSU isolation test PASSED — lanjut full build"

    # ══════════════════════════════════════════════════════════
    # STEP 8: Compile Kernel (Full)
    # ══════════════════════════════════════════════════════════

    - name: 🔨 Compile kernel
      run: |
        cd kernel

        BUILD_START=$(date +%s)
        echo "════════════════════════════════════════"
        echo "  Starting full kernel build"
        echo "════════════════════════════════════════"
        echo "Compiler : $(clang --version | head -1)"
        echo "Cores    : $(nproc)"
        echo "Disk free: $(df -h / | tail -1 | awk '{print $4}')"
        echo "Time     : $(date '+%Y-%m-%d %H:%M:%S')"

        set -o pipefail
        timeout 90m make O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          -j$(nproc) \
          2>&1 | tee build.log

        BUILD_EXIT=${PIPESTATUS[0]}
        BUILD_TIME=$(( $(date +%s) - BUILD_START ))

        echo ""
        echo "════════════════════════════════════════"
        echo "Exit code: $BUILD_EXIT"
        echo "Duration : $(printf '%02d:%02d:%02d' \
          $((BUILD_TIME/3600)) \
          $((BUILD_TIME%3600/60)) \
          $((BUILD_TIME%60)))"
        echo "Disk free: $(df -h / | tail -1 | awk '{print $4}')"

        if [ "$BUILD_EXIT" -ne 0 ]; then
          echo "❌ COMPILATION FAILED"
          AVAIL_MB=$(( $(df / | tail -1 | awk '{print $4}') / 1024 ))
          [ "$AVAIL_MB" -lt 500 ] && echo "🚨 DISK KRITIS: ${AVAIL_MB}MB"

          if [ -f build.log ] && [ -s build.log ]; then
            echo ""
            echo "▶ [A] LAST 80 LINES:"
            tail -80 build.log
            echo ""
            echo "▶ [B] FIRST ERROR + context:"
            ERRLINE=$(grep -n \
              -E '^[^:]+\.(c|h|S):[0-9]+:[0-9]+: error:|make\[[0-9]+\]: \*\*\*|No space left|ld\.lld: error:|undefined reference' \
              build.log | head -1 | cut -d: -f1)
            if [ -n "$ERRLINE" ]; then
              START=$(( ERRLINE > 20 ? ERRLINE - 20 : 1 ))
              sed -n "${START},$(( ERRLINE + 40 ))p" build.log
            fi
            echo ""
            echo "▶ [C] ALL ERRORS:"
            grep -n -E 'error:|undefined reference|No space left' \
              build.log | head -50 || echo "  (tidak ada)"
          else
            echo "❌ build.log tidak ada / kosong"
          fi
          exit 1
        fi

        echo "▶ Build artifacts:"
        FOUND=0
        for img in Image.gz-dtb Image.gz Image; do
          if [ -f "out/arch/arm64/boot/$img" ]; then
            echo "  ✅ $img ($(du -h out/arch/arm64/boot/$img | cut -f1))"
            FOUND=1
          fi
        done
        [ "$FOUND" -eq 0 ] && { echo "❌ Tidak ada kernel image!"; exit 1; }
        echo "✅ BUILD SUCCESS (SukiSU Ultra)"

    # ══════════════════════════════════════════════════════════
    # STEP 9: Create Flashable ZIP
    # ══════════════════════════════════════════════════════════

    - name: 📦 Create AnyKernel3 flashable ZIP
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
        cd AnyKernel3

        sed -i 's|do\.devicecheck=.*|do.devicecheck=1|'                    anykernel.sh
        sed -i 's|device\.name1=.*|device.name1=timelm|'                  anykernel.sh
        sed -i 's|device\.name2=.*|device.name2=lge_v60|'                 anykernel.sh
        sed -i 's|device\.name3=.*|device.name3=LM-V600|'                 anykernel.sh
        sed -i 's|device\.name4=.*|device.name4=LM-V600N|'                anykernel.sh
        sed -i 's|device\.name5=.*|device.name5=|'                        anykernel.sh
        sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|'     anykernel.sh
        sed -i 's|is_slot_device=.*|is_slot_device=1;|'                    anykernel.sh

        BRANCH="${{ github.event.inputs.kernel_branch }}"
        sed -i "s|kernel\.string=.*|kernel.string=SukiSU Ultra LG V60 (${BRANCH})|" \
          anykernel.sh

        BOOT="../kernel/out/arch/arm64/boot"
        COPIED=0
        for img in Image.gz-dtb Image.gz Image; do
          if [ -f "$BOOT/$img" ]; then
            cp "$BOOT/$img" ./
            echo "✅ $img ($(du -h $img | cut -f1))"
            COPIED=1; break
          fi
        done
        [ "$COPIED" -eq 0 ] && { echo "❌ No kernel image!"; exit 1; }

        mkdir -p dtbs
        if [ -d "$BOOT/dts" ]; then
          DTB_COUNT=$(find "$BOOT/dts" -name "*.dtb" | wc -l)
          [ "$DTB_COUNT" -gt 0 ] && \
            find "$BOOT/dts" -name "*.dtb" -exec cp {} dtbs/ \; && \
            echo "✅ $DTB_COUNT DTB files"
        fi

        BUILD_DATE=$(date +%Y%m%d-%H%M)
        ZIP_NAME="SukiSU-Ultra-V60-${BRANCH}-${BUILD_DATE}.zip"
        zip -r9 "../${ZIP_NAME}" . \
          -x ".git/*" -x "README.md" -x "*.placeholder" -x ".gitignore"
        cd ..
        echo "✅ ZIP: ${ZIP_NAME} ($(du -h ${ZIP_NAME} | cut -f1))"

    # ══════════════════════════════════════════════════════════
    # STEP 10: Upload Artifacts
    # ══════════════════════════════════════════════════════════

    - name: ⬆️ Upload kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: SukiSU-Ultra-V60-Kernel-${{ github.event.inputs.kernel_branch }}
        path: SukiSU-Ultra-V60-*.zip
        retention-days: 7
        compression-level: 0

    - name: ⬆️ Upload build logs & config
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ github.event.inputs.kernel_branch }}
        path: |
          kernel/build.log
          kernel/ksu_build_test.log
          patch.log
          kernel/out/.config
        retention-days: 7

    # ══════════════════════════════════════════════════════════
    # STEP 11: Summary
    # ══════════════════════════════════════════════════════════

    - name: 📊 Build summary
      if: always()
      run: |
        echo "═══════════════════════════════════════════════════════"
        echo "              BUILD SUMMARY — SukiSU Ultra v5"
        echo "═══════════════════════════════════════════════════════"

        if ls SukiSU-Ultra-V60-*.zip 1>/dev/null 2>&1; then
          echo "✅ Status: SUCCESS"
          ls -lh SukiSU-Ultra-V60-*.zip
          echo ""
          echo "📥 Download: Actions → Summary → Artifacts"
          echo "📱 Flash via TWRP/OrangeFox"
          echo "⚠️  Backup boot.img dulu!"
          echo "⚠️  Gunakan SukiSU Ultra Manager (BUKAN KernelSU Manager)"
        else
          echo "❌ Status: FAILED"
          echo ""
          echo "📋 Troubleshooting:"
          echo "  1. Cek step 'Pre-build KSU module isolation test'"
          echo "  2. Cek step 'Compile kernel' bagian [A][B][C]"
          echo "  3. Download artifact 'build-logs'"
          echo ""
          echo "🔧 Fixes di v5:"
          echo "  - Fix grep quoting: single-quote untuk literal string check"
          echo "    → Root cause: double-quote expand \$(srctree) sebagai subshell"
          echo "    → Membuat kondisi check ccflags-y SELALU FALSE"
          echo "    → Inject tidak berjalan meskipun kode ada"
          echo "  - Tambah mandatory verification setelah inject"
          echo "  - Tambah fallback symlink uapi/ jika direktori tidak ada"
          echo "  - Sederhanakan logic inject (atomic & idempotent)"
        fi

        echo ""
        echo "Branch  : ${{ github.event.inputs.kernel_branch }}"
        echo "Time    : $(date '+%Y-%m-%d %H:%M:%S %Z')"
        echo "Run URL : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo "═══════════════════════════════════════════════════════"
