name: "U0001F528 Build LG V60 Kernel + SukiSU Ultra"

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Branch kernel LineageOS'
        required: true
        default: 'lineage-22.2'
        type: choice
        options:
          - lineage-23.2
          - lineage-23.0
          - lineage-22.2

env:
  ARCH: arm64
  SUBARCH: arm64
  CC: clang
  LD: ld.lld
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

    # ══════════════════════════════════════════════════════════
    # STEP 1: Setup Environment
    # ══════════════════════════════════════════════════════════

    - name: "U0001F4E5 Checkout repository"
      uses: actions/checkout@v4

    - name: "U0001F5D1️ Free up disk space"
      run: |
        echo "Disk sebelum cleanup:"
        df -h / | tail -1
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /usr/local/.ghcup \
          /usr/share/swift \
          /opt/hostedtoolcache/CodeQL \
          /usr/local/share/boost
        sudo apt-get clean
        sudo apt-get autoremove -y
        echo "Disk setelah cleanup:"
        df -h / | tail -1

    - name: "U0001F4E6 Install build dependencies"
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          git bc bison flex libssl-dev libelf-dev \
          libncurses5-dev python3 python-is-python3 \
          zip unzip wget curl cpio kmod \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

    - name: "⚙️ Install Clang 17"
      run: |
        wget -q https://apt.llvm.org/llvm.sh -O llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 17 all
        for tool in clang clang++ ld.lld llvm-ar llvm-nm \
                    llvm-objcopy llvm-objdump llvm-readelf \
                    llvm-strip llvm-ranlib; do
          if [ -f "/usr/bin/${tool}-17" ]; then
            sudo ln -sf "/usr/bin/${tool}-17" "/usr/local/bin/${tool}"
          fi
        done
        echo "Clang version:"; clang --version | head -3
        echo "LLD version:";   ld.lld --version

    # ══════════════════════════════════════════════════════════
    # STEP 2: Clone Kernel Source
    # ══════════════════════════════════════════════════════════

    - name: "U0001F4E5 Clone kernel source"
      run: |
        git clone --depth=1 \
          https://github.com/LineageOS/android_kernel_lge_sm8250 \
          -b ${{ github.event.inputs.kernel_branch }} kernel
        cd kernel
        echo "Kernel version:"
        head -3 Makefile | grep -E 'VERSION|PATCHLEVEL|SUBLEVEL' | \
          awk '{print $3}' | tr '\n' '.' | sed 's/\.$//'
        echo ""

    # ══════════════════════════════════════════════════════════
    # STEP 3: Inject SukiSU Ultra
    #
    # FIX #2: Ganti symlink → cp -r (hardcopy)
    #   Symlink (bahkan absolute) bisa menyebabkan Kbuild salah resolve
    #   path di beberapa versi Android kernel fork. Hardcopy adalah
    #   pendekatan paling robust dan direkomendasikan oleh KernelSU docs.
    #
    # FIX #4: Validasi struktur SukiSU SEBELUM integrasi.
    #   Fail fast dengan pesan yang jelas jika repo tidak punya
    #   Makefile/Kconfig di path yang diexpect.
    # ══════════════════════════════════════════════════════════

    - name: "U0001F489 Clone & integrate SukiSU Ultra source"
      run: |
        cd kernel

        echo "▶ Cloning SukiSU Ultra repository..."
        if ! git clone --depth=1 \
          https://github.com/SukiSU-Ultra/SukiSU-Ultra SukiSU; then
          echo "❌ Gagal clone SukiSU Ultra repository!"
          exit 1
        fi

        # ── FIX #4: Validasi struktur repo SukiSU ──────────────
        echo ""
        echo "▶ Validating SukiSU repo structure..."
        echo "   Full SukiSU root contents:"
        ls -la SukiSU/

        # Cari direktori yang berisi Kconfig (bisa di root atau subdir)
        SUKISU_KERNEL_DIR=""
        for candidate in "SukiSU/kernel" "SukiSU" "SukiSU/KernelSU/kernel"; do
          if [ -f "${candidate}/Kconfig" ] && [ -f "${candidate}/Makefile" ]; then
            SUKISU_KERNEL_DIR="${candidate}"
            echo "   ✅ Found SukiSU kernel dir: ${candidate}"
            break
          fi
        done

        if [ -z "$SUKISU_KERNEL_DIR" ]; then
          echo ""
          echo "❌ GAGAL: Tidak dapat menemukan Kconfig + Makefile di repo SukiSU!"
          echo "   Struktur repo yang ditemukan:"
          find SukiSU -name 'Kconfig' -o -name 'Makefile' | head -20
          echo ""
          echo "   Isi direktori SukiSU/:"
          ls -la SukiSU/
          if [ -d "SukiSU/kernel" ]; then
            echo "   Isi SukiSU/kernel/:"
            ls -la SukiSU/kernel/
          fi
          exit 1
        fi

        echo "   C files in SukiSU kernel dir:"
        ls "${SUKISU_KERNEL_DIR}"/*.c 2>/dev/null | head -10 || echo "   (no .c files at root, may be in subdirs)"

        # ── FIX #2: Hardcopy (cp -r) bukan symlink ─────────────
        echo ""
        echo "▶ Copying SukiSU kernel dir to drivers/kernelsu/ (FIX #2: hardcopy)..."
        cp -r "${SUKISU_KERNEL_DIR}" drivers/kernelsu

        # Verifikasi hasil copy
        if [ ! -d drivers/kernelsu ]; then
          echo "❌ Hardcopy gagal — drivers/kernelsu tidak ada!"
          exit 1
        fi
        if [ ! -f drivers/kernelsu/Kconfig ]; then
          echo "❌ Hardcopy OK tapi Kconfig tidak ada di drivers/kernelsu/!"
          ls -la drivers/kernelsu/
          exit 1
        fi
        if [ ! -f drivers/kernelsu/Makefile ]; then
          echo "❌ Hardcopy OK tapi Makefile tidak ada di drivers/kernelsu/!"
          ls -la drivers/kernelsu/
          exit 1
        fi

        echo "✅ drivers/kernelsu/ ready:"
        ls -la drivers/kernelsu/ | head -20

    # ── Integrate into build system ────────────────────────────
    - name: "U0001F527 Integrate SukiSU into build system"
      run: |
        cd kernel

        echo "▶ Patching drivers/Makefile..."
        # ── FIX #1: Gunakan obj-$(CONFIG_KSU) bukan obj-y ──────
        # obj-y = SELALU build direktori ini (bahkan jika KSU=n → error!)
        # obj-$(CONFIG_KSU) = hanya build jika CONFIG_KSU=y atau =m
        # Ini adalah ROOT CAUSE utama dari "Makefile:1892 Error 2"!
        if ! grep -q 'kernelsu' drivers/Makefile; then
          # FIX #1: obj-$(CONFIG_KSU) bukan obj-y
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          echo "  ✅ Added: obj-$(CONFIG_KSU) += kernelsu/ (FIX #1)"
        else
          # Jika sudah ada tapi masih obj-y, fix ke obj-$(CONFIG_KSU)
          if grep -q 'obj-y += kernelsu/' drivers/Makefile; then
            sed -i 's|obj-y += kernelsu/|obj-$(CONFIG_KSU) += kernelsu/|g' drivers/Makefile
            echo "  ✅ Fixed: obj-y → obj-$(CONFIG_KSU) in Makefile (FIX #1)"
          else
            echo "  ⏭️  kernelsu sudah ada di Makefile"
          fi
        fi

        echo "▶ Patching drivers/Kconfig..."
        if ! grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
          if grep -q '^endmenu' drivers/Kconfig; then
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
            echo "  ✅ Added kernelsu to Kconfig (before endmenu)"
          else
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
            echo "  ✅ Added kernelsu to Kconfig (appended)"
          fi
        else
          echo "  ⏭️  kernelsu sudah ada di Kconfig"
        fi

        echo ""
        echo "Verifikasi integrasi:"
        echo "  Makefile entry : $(grep 'kernelsu' drivers/Makefile)"
        echo "  Kconfig entry  : $(grep 'kernelsu' drivers/Kconfig)"

        # ── Preview Makefile SukiSU untuk deteksi dini masalah ──
        echo ""
        echo "▶ Preview drivers/kernelsu/Makefile (10 baris pertama):"
        head -10 drivers/kernelsu/Makefile || echo "  (tidak bisa dibaca)"

        echo ""
        echo "▶ CONFIG_KSU di Kconfig SukiSU:"
        grep -A 8 'config KSU' drivers/kernelsu/Kconfig || echo "  (tidak ditemukan)"

    # ══════════════════════════════════════════════════════════
    # STEP 4: Apply Manual Hooks
    # ══════════════════════════════════════════════════════════

    - name: "U0001F527 Apply kernel hooks"
      run: |
        echo "▶ Running apply_hooks.py..."
        SCRIPT="$GITHUB_WORKSPACE/scripts/apply_hooks.py"
        KERNEL_DIR="$GITHUB_WORKSPACE/kernel"

        if [ ! -f "$SCRIPT" ]; then
          echo "❌ apply_hooks.py tidak ditemukan di: $SCRIPT"
          exit 1
        fi

        if ! python3 "$SCRIPT" "$KERNEL_DIR" 2>&1 | tee patch.log; then
          echo "❌ PATCH SCRIPT GAGAL"
          cat patch.log
          exit 1
        fi

        echo ""
        echo "▶ Validating critical patches..."
        CRITICAL_FILES=(
          "fs/exec.c:ksu_execveat_hook"
          "fs/open.c:ksu_handle_faccessat"
          "drivers/input/input.c:ksu_input_hook"
        )
        FAILED=0
        for entry in "${CRITICAL_FILES[@]}"; do
          FILE="${entry%%:*}"
          MARKER="${entry##*:}"
          if grep -q "$MARKER" "$KERNEL_DIR/$FILE" 2>/dev/null; then
            echo "  ✅ $FILE ($MARKER)"
          else
            echo "  ❌ CRITICAL: $FILE tidak memiliki $MARKER"
            FAILED=1
          fi
        done
        if [ $FAILED -eq 1 ]; then
          echo "❌ Patch kritis gagal!"
          exit 1
        fi
        echo "✅ Semua patch kritis berhasil"

    # ══════════════════════════════════════════════════════════
    # STEP 5: Configure Kernel
    # ══════════════════════════════════════════════════════════

    - name: "U0001F3D7️ Configure kernel"
      run: |
        cd kernel

        echo "════════════════════════════════════════"
        echo "  [1/3] Base defconfig"
        echo "════════════════════════════════════════"
        make O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          vendor/kona-perf_defconfig

        echo ""
        echo "════════════════════════════════════════"
        echo "  [2/3] Merge device-specific config"
        echo "════════════════════════════════════════"
        TIMELM_CFG=""
        for cfg_path in \
          "arch/arm64/configs/vendor/timelm.config" \
          "arch/arm64/configs/timelm.config"; do
          if [ -f "$cfg_path" ]; then
            TIMELM_CFG="$cfg_path"
            break
          fi
        done

        if [ -n "$TIMELM_CFG" ]; then
          echo "  Using: $TIMELM_CFG"
          ./scripts/kconfig/merge_config.sh -O out out/.config "$TIMELM_CFG"
          MERGE_EXIT=$?
          [ $MERGE_EXIT -ne 0 ] && echo "⚠️  merge_config.sh exit $MERGE_EXIT (non-fatal)"
        else
          echo "  ⚠️  timelm.config tidak ditemukan, skip"
        fi

        echo ""
        echo "════════════════════════════════════════"
        echo "  [3/3] Enable SukiSU Ultra configs"
        echo "════════════════════════════════════════"
        ./scripts/config --file out/.config \
          --enable CONFIG_KPROBES \
          --enable CONFIG_HAVE_KPROBES \
          --enable CONFIG_KPROBE_EVENTS \
          --enable CONFIG_EXT4_FS \
          --enable CONFIG_MODULES \
          --enable CONFIG_MODULE_UNLOAD \
          --enable CONFIG_OVERLAY_FS \
          --enable CONFIG_KSU

        # Cek nama config KSU_MANUAL_HOOK yang tepat dari Kconfig SukiSU
        MANUAL_HOOK_CFG=$(grep -o 'config KSU_MANUAL_HOOK\|config KSU_MANUAL\b' \
          drivers/kernelsu/Kconfig 2>/dev/null | head -1 | awk '{print $2}')
        if [ -n "$MANUAL_HOOK_CFG" ]; then
          echo "  Enabling $MANUAL_HOOK_CFG (non-kprobe fallback)..."
          ./scripts/config --file out/.config --enable "CONFIG_${MANUAL_HOOK_CFG}"
        fi

        make O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          olddefconfig

        echo ""
        echo "▶ Verifying SukiSU configs..."
        KSU_VAL=$(grep -E '^CONFIG_KSU=' out/.config | cut -d= -f2)
        if [ "$KSU_VAL" = "y" ] || [ "$KSU_VAL" = "m" ]; then
          echo "  ✅ CONFIG_KSU=${KSU_VAL}"
        else
          echo "  ❌ CONFIG_KSU tidak aktif! Nilai: '${KSU_VAL}'"
          echo "  Dependency check:"
          grep '^CONFIG_KPROBES='  out/.config || echo "    CONFIG_KPROBES not set"
          grep '^CONFIG_EXT4_FS='  out/.config || echo "    CONFIG_EXT4_FS not set"
          grep '^CONFIG_MODULES='  out/.config || echo "    CONFIG_MODULES not set"
          echo "  KSU Kconfig:"
          grep -A8 'config KSU' drivers/kernelsu/Kconfig || echo "  TIDAK ADA!"
          exit 1
        fi
        grep '^CONFIG_MODULES='    out/.config || echo "  CONFIG_MODULES not set"
        grep '^CONFIG_KPROBES='    out/.config || echo "  CONFIG_KPROBES not set"
        grep '^CONFIG_OVERLAY_FS=' out/.config || echo "  CONFIG_OVERLAY_FS not set"

    # ══════════════════════════════════════════════════════════
    # STEP 5b: Pre-build KSU isolation test
    #
    # FIX #3: Tambah V=1 (verbose) agar error kompilasi C tampil
    #   lengkap di log, bukan hanya summary "Error 2".
    # FIX #5: Print full log ke stdout bahkan saat sukses (summary).
    # ══════════════════════════════════════════════════════════

    - name: "U0001F9EA Pre-build KSU module isolation test"
      run: |
        cd kernel

        echo "════════════════════════════════════════"
        echo "  KSU Module Isolation Test (FIX #3: V=1 verbose)"
        echo "  Target: drivers/kernelsu/ only"
        echo "════════════════════════════════════════"
        echo ""

        # FIX #3: Tambah V=1 untuk verbose compiler output.
        # Tanpa V=1, make hanya print "CC drivers/kernelsu/xxx.o"
        # dan tidak menampilkan error clang yang sebenarnya.
        # Dengan V=1, full clang command + error message akan tampil.
        set -o pipefail
        make O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          V=1 \
          -j$(nproc) \
          drivers/kernelsu/ 2>&1 | tee ksu_build_test.log

        KSU_TEST_EXIT=${PIPESTATUS[0]}

        # FIX #5: Always print key info dari log
        echo ""
        echo "▶ Build log summary (warnings & errors):"
        echo "────────────────────────────────────────────"
        grep -E 'warning:|error:|note:|undefined|cannot find|No such' \
          ksu_build_test.log | head -30 || echo "  (tidak ada warning/error)"
        echo "────────────────────────────────────────────"

        if [ $KSU_TEST_EXIT -ne 0 ]; then
          echo ""
          echo "❌ KSU MODULE BUILD FAILED"
          echo "   Root cause terisolasi di step ini!"
          echo ""
          echo "▶ LAST 60 LINES of ksu_build_test.log:"
          echo "════════════════════════════════════════"
          tail -60 ksu_build_test.log
          echo "════════════════════════════════════════"
          echo ""
          echo "▶ ALL ERROR LINES:"
          grep -n -E 'error:|undefined reference|cannot find|No such file|fatal error' \
            ksu_build_test.log || echo "  (tidak ada pattern error standar)"
          exit 1
        fi

        echo ""
        echo "✅ KSU isolation test PASSED!"
        echo "   Lanjut ke full kernel build..."

    # ══════════════════════════════════════════════════════════
    # STEP 6: Build Kernel (Full)
    # ══════════════════════════════════════════════════════════

    - name: "U0001F528 Compile kernel"
      run: |
        cd kernel

        BUILD_START=$(date +%s)
        echo "════════════════════════════════════════"
        echo "  Starting full kernel build"
        echo "════════════════════════════════════════"
        echo "Compiler : $(clang --version | head -1)"
        echo "Cores    : $(nproc)"
        echo "Disk free: $(df -h / | tail -1 | awk '{print $4}')"
        echo "Time     : $(date '+%Y-%m-%d %H:%M:%S')"
        echo "════════════════════════════════════════"

        set -o pipefail
        timeout 90m make O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
          -j$(nproc) \
          2>&1 | tee build.log

        BUILD_EXIT=${PIPESTATUS[0]}

        BUILD_END=$(date +%s)
        BUILD_TIME=$(( BUILD_END - BUILD_START ))

        echo ""
        echo "════════════════════════════════════════"
        echo "Exit code: $BUILD_EXIT"
        echo "Duration : $(printf '%02d:%02d:%02d' $((BUILD_TIME/3600)) $((BUILD_TIME%3600/60)) $((BUILD_TIME%60)))"
        echo "Disk free: $(df -h / | tail -1 | awk '{print $4}')"
        echo "════════════════════════════════════════"

        if [ "$BUILD_EXIT" -ne 0 ]; then
          echo "❌ COMPILATION FAILED"
          echo ""

          AVAIL_KB=$(df / | tail -1 | awk '{print $4}')
          AVAIL_MB=$(( AVAIL_KB / 1024 ))
          [ "$AVAIL_MB" -lt 500 ] && echo "U0001F6A8 DISK KRITIS: ${AVAIL_MB}MB tersisa"

          if [ -f build.log ] && [ -s build.log ]; then
            echo ""
            echo "▶ [A] LAST 80 LINES (linker errors biasanya di sini):"
            echo "══════════════════════════════════════════════════"
            tail -80 build.log
            echo ""

            echo "▶ [B] FIRST ERROR + context:"
            echo "══════════════════════════════════════════════════"
            ERRLINE=$(grep -n \
              -E '^[^:]+\.(c|h|S):[0-9]+:[0-9]+: error:|make\[[0-9]+\]: \*\*\*|No space left|ld\.lld: error:|undefined reference' \
              build.log | head -1 | cut -d: -f1)
            if [ -n "$ERRLINE" ]; then
              echo "  → First error at build.log line $ERRLINE"
              START=$(( ERRLINE > 20 ? ERRLINE - 20 : 1 ))
              sed -n "${START},$(( ERRLINE + 40 ))p" build.log
            else
              echo "  (tidak ada pola error standar)"
            fi

            echo ""
            echo "▶ [C] ALL ERROR LINES:"
            echo "══════════════════════════════════════════════════"
            grep -n -E 'error:|undefined reference|No space left' build.log | head -50 \
              || echo "  (tidak ada)"
          else
            echo "❌ build.log tidak ada / kosong"
          fi
          exit 1
        fi

        echo "▶ Build artifacts:"
        IMAGES_FOUND=0
        for img in Image.gz-dtb Image.gz Image; do
          if [ -f "out/arch/arm64/boot/$img" ]; then
            SIZE=$(du -h "out/arch/arm64/boot/$img" | cut -f1)
            echo "  ✅ $img ($SIZE)"
            IMAGES_FOUND=1
          fi
        done
        [ "$IMAGES_FOUND" -eq 0 ] && { echo "❌ Tidak ada kernel image!"; ls -la out/arch/arm64/boot/ || true; exit 1; }

        echo ""
        echo "✅ BUILD SUCCESS (SukiSU Ultra)"

    # ══════════════════════════════════════════════════════════
    # STEP 7: Create Flashable ZIP
    # ══════════════════════════════════════════════════════════

    - name: "U0001F4E6 Create AnyKernel3 flashable ZIP"
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
        cd AnyKernel3

        sed -i 's|do\.devicecheck=.*|do.devicecheck=1|' anykernel.sh
        sed -i 's|device\.name1=.*|device.name1=timelm|' anykernel.sh
        sed -i 's|device\.name2=.*|device.name2=lge_v60|' anykernel.sh
        sed -i 's|device\.name3=.*|device.name3=LM-V600|' anykernel.sh
        sed -i 's|device\.name4=.*|device.name4=LM-V600N|' anykernel.sh
        sed -i 's|device\.name5=.*|device.name5=|' anykernel.sh
        sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
        sed -i 's|is_slot_device=.*|is_slot_device=1;|' anykernel.sh

        BRANCH="${{ github.event.inputs.kernel_branch }}"
        sed -i "s|kernel\.string=.*|kernel.string=SukiSU Ultra for LG V60 ThinQ (${BRANCH})|" anykernel.sh

        BOOT="../kernel/out/arch/arm64/boot"
        COPIED=0
        for img in Image.gz-dtb Image.gz Image; do
          if [ -f "$BOOT/$img" ]; then
            cp "$BOOT/$img" ./
            echo "✅ $img copied ($(du -h $img | cut -f1))"
            COPIED=1; break
          fi
        done
        [ "$COPIED" -eq 0 ] && { echo "❌ No kernel image!"; exit 1; }

        mkdir -p dtbs
        if [ -d "$BOOT/dts" ]; then
          DTB_COUNT=$(find "$BOOT/dts" -name "*.dtb" | wc -l)
          [ "$DTB_COUNT" -gt 0 ] && find "$BOOT/dts" -name "*.dtb" -exec cp {} dtbs/ \; && echo "✅ $DTB_COUNT DTB files copied"
        fi

        BUILD_DATE=$(date +%Y%m%d-%H%M)
        ZIP_NAME="SukiSU-Ultra-V60-${BRANCH}-${BUILD_DATE}.zip"
        zip -r9 "../${ZIP_NAME}" . -x ".git/*" -x "README.md" -x "*.placeholder" -x ".gitignore"
        cd ..
        echo "✅ ZIP: ${ZIP_NAME} ($(du -h ${ZIP_NAME} | cut -f1))"

    # ══════════════════════════════════════════════════════════
    # STEP 8: Upload Artifacts
    # ══════════════════════════════════════════════════════════

    - name: "⬆️ Upload kernel ZIP"
      uses: actions/upload-artifact@v4
      with:
        name: SukiSU-Ultra-V60-Kernel-${{ github.event.inputs.kernel_branch }}
        path: SukiSU-Ultra-V60-*.zip
        retention-days: 7
        compression-level: 0

    - name: "⬆️ Upload build logs & config"
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ github.event.inputs.kernel_branch }}
        path: |
          kernel/build.log
          kernel/ksu_build_test.log
          patch.log
          kernel/out/.config
        retention-days: 7

    # ══════════════════════════════════════════════════════════
    # STEP 9: Summary
    # ══════════════════════════════════════════════════════════

    - name: "U0001F4CA Build summary"
      if: always()
      run: |
        echo ""
        echo "═══════════════════════════════════════════════════════"
        echo "              BUILD SUMMARY — SukiSU Ultra"
        echo "═══════════════════════════════════════════════════════"

        if ls SukiSU-Ultra-V60-*.zip 1>/dev/null 2>&1; then
          echo "✅ Status: SUCCESS"
          ls -lh SukiSU-Ultra-V60-*.zip
          echo ""
          echo "U0001F4E5 Download: Actions → Summary → Artifacts"
          echo "U0001F4F1 Flash via TWRP/OrangeFox"
